<title>圆相交公共弦与底边垂直证明 — 分步演示</title>
<style>

</style>
  <!-- KaTeX 数学公式渲染引擎 -->

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <!-- KaTeX 全局自愈渲染函数（支持动态步骤与几何宏扩展） -->
  <script>

          ],

            '\angmsd': '\angle'
          },

</head>
<body>
<div class="container">
  <header>
    <h1>例 7：圆相交公共弦与底边垂直证明</h1>
    <p>已知：$L$ 是 $BC$ 中点，$E, F$ 分别是 $L$ 在 $AC, AB$ 上的射影，圆 $ABE$ 与圆 $ACF$ 交于另一点 $P$ ｜ 求证：$AP \bot BC$</p>
  </header>
  <div class="main">
    <div class="canvas-card">
      <svg id="stage" viewBox="0 0 660 540" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="panel">
      <div class="step-list" id="stepList"></div>
      <div class="controls">
        <button class="btn-ghost" id="btnPrev">◀ 上一步</button>
        <button class="btn-primary" id="btnNext">下一步 ▶</button>
        <button class="btn-ghost" id="btnAuto">▶ 自动</button>
        <button class="btn-ghost" id="btnReset">重置</button>
      </div>
      <div class="progress">也可用键盘 <kbd>←</kbd> <kbd>→</kbd> 切换步骤</div>
    </div>
  </div>
</div>

<script>
/* ============ 几何基础与向量运算 ============ */
const sub = (p,q) => ({x:p.x-q.x, y:p.y-q.y});
const add = (p,q) => ({x:p.x+q.x, y:p.y+q.y});
const mul = (p,k) => ({x:p.x*k, y:p.y*k});
const mid = (p,q) => ({x:(p.x+q.x)/2, y:(p.y+q.y)/2});
const len = p => Math.hypot(p.x, p.y);
const dist = (p,q) => len(sub(p,q));
const norm = p => { const l = len(p); return l === 0 ? {x:0, y:0} : {x:p.x/l, y:p.y/l}; };
const perp = d => ({x:-d.y, y:d.x});

function foot(P, P1, P2){   // P 到直线 P1P2 的垂足
  const d = sub(P2,P1);
  const denom = d.x*d.x + d.y*d.y;
  if (denom < 1e-9) return P1;
  const t = ((P.x-P1.x)*d.x + (P.y-P1.y)*d.y) / denom;
  return add(P1, mul(d, t));
}

function circumcenter(p1, p2, p3){
  const d = 2 * (p1.x * (p2.y - p3.y) + p2.x * (p3.y - p1.y) + p3.x * (p1.y - p2.y));
  if (Math.abs(d) < 1e-9) return mid(p1, p2);
  const p1Sq = p1.x*p1.x + p1.y*p1.y;
  const p2Sq = p2.x*p2.x + p2.y*p2.y;
  const p3Sq = p3.x*p3.x + p3.y*p3.y;
  const ux = (p1Sq * (p2.y - p3.y) + p2Sq * (p3.y - p1.y) + p3Sq * (p1.y - p2.y)) / d;
  const uy = (p1Sq * (p3.x - p2.x) + p2Sq * (p1.x - p3.x) + p3Sq * (p2.x - p1.x)) / d;
  return {x: ux, y: uy};
}

/* ============ 精确几何点位解算（严格数学守恒） ============ */
const ptB = { x: 138, y: 360 };
const ptC = { x: 522, y: 360 };
const ptA = { x: 301.2, y: 129.6 };

// 底边中点 L 与射影 E, F
const ptL = mid(ptB, ptC);          // (330, 360)
const ptE = foot(ptL, ptA, ptC);    // 射影 E 位于 AC
const ptF = foot(ptL, ptA, ptB);    // 射影 F 位于 AB

// 圆 ABE 与 圆 ACF 的外心与半径
const ptO1 = circumcenter(ptA, ptB, ptE);
const r1 = dist(ptO1, ptA);
const ptO2 = circumcenter(ptA, ptC, ptF);
const r2 = dist(ptO2, ptA);

// 直径 AM, AN 端点
const ptM = sub(mul(ptO1, 2), ptA);
const ptN = sub(mul(ptO2, 2), ptA);

// 第二交点 P（因 AP ⊥ MN，P 为 A 在直线 MN 上的垂足）
const ptP = foot(ptA, ptM, ptN);

// AP 与底边 BC 的交点 H
const ptH = foot(ptA, ptB, ptC);

// 点 M, N 到底边 BC 的垂足（用于 Step 4 证明等高）
const ptHM = { x: ptM.x, y: ptB.y };
const ptHN = { x: ptN.x, y: ptC.y };

/* ============ SVG 绘图工具 ============ */
const NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById('stage');

function el(tag, attrs = {}, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function line(p, q, attrs, parent){
  return el('line', {x1:p.x, y1:p.y, x2:q.x, y2:q.y, ...attrs}, parent);
}
function segDashed(p, q, color, w=2, parent, dash='7 5'){
  return line(p, q, {stroke:color, 'stroke-width':w, 'stroke-dasharray':dash, fill:'none'}, parent);
}
function circle(c, r, attrs = {}, parent){
  return el('circle', {cx:c.x, cy:c.y, r, fill:'none', ...attrs}, parent);
}
function dot(p, color, r=4.5, parent){
  return el('circle', {cx:p.x, cy:p.y, r, fill:color, stroke:'#fff', 'stroke-width':1.5}, parent);
}
function polygon(pts, attrs = {}, parent){
  return el('polygon', {points: pts.map(p=>`${p.x},${p.y}`).join(' '), ...attrs}, parent);
}
function label(p, text, dx=0, dy=0, color='#0f172a', parent, size=16, bold=true){
  const t = el('text', {x:p.x+dx, y:p.y+dy, 'font-size':size, fill:color,
    'text-anchor':'middle', 'dominant-baseline':'central',
    'font-family':'"Times New Roman", serif', 'font-style':'italic',
    'font-weight': bold ? '700' : '400'}, parent);
  t.textContent = text;
  return t;
}
function rightAngleMark(v, p1, p2, s=12, color='#dc2626', parent){
  const u1 = norm(sub(p1,v)), u2 = norm(sub(p2,v));
  const a = add(v, mul(u1,s)), b = add(add(v, mul(u1,s)), mul(u2,s)), c = add(v, mul(u2,s));
  return el('polyline', {points:`${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y}`,
    fill:'none', stroke:color, 'stroke-width':1.8}, parent);
}
function tickMarks(p, q, color='#2563eb', count=1, parent){
  const m = mid(p,q), d = norm(sub(q,p)), n = perp(d);
  const spacing = 5;
  const offsets = count === 1 ? [0] : (count === 2 ? [-spacing/2, spacing/2] : [-spacing, 0, spacing]);
  offsets.forEach(offset => {
    const c = add(m, mul(d, offset));
    line(add(c, mul(n, 5.5)), add(c, mul(n, -5.5)), {stroke: color, 'stroke-width': 2, 'stroke-linecap': 'round'}, parent);
  });
}
function arrowMark(p, q, color='#d97706', parent){
  const m = mid(p,q), d = norm(sub(q,p)), n = perp(d);
  const tip = add(m, mul(d,8));
  const p1 = add(add(m, mul(d,-6)), mul(n,5));
  const p2 = add(add(m, mul(d,-6)), mul(n,-5));
  el('polygon', {points:`${tip.x},${tip.y} ${p1.x},${p1.y} ${p2.x},${p2.y}`, fill:color}, parent);
}
function highlightSeg(p, q, color, parent, w=4){
  line(p, q, {stroke:color, 'stroke-width':w+6, 'stroke-linecap':'round', opacity:.18}, parent);
  line(p, q, {stroke:color, 'stroke-width':w, 'stroke-linecap':'round'}, parent);
}
function angleArc(v, p1, p2, r=20, attrs={}, parent){
  const a1 = Math.atan2(p1.y - v.y, p1.x - v.x);
  let a2 = Math.atan2(p2.y - v.y, p2.x - v.x);
  let da = a2 - a1;
  while (da < 0) da += Math.PI * 2;
  const sweep = da <= Math.PI ? 1 : 0;
  const s = { x: v.x + r * Math.cos(a1), y: v.y + r * Math.sin(a1) };
  const e = { x: v.x + r * Math.cos(a2), y: v.y + r * Math.sin(a2) };
  return el('path', {
    d: `M ${s.x} ${s.y} A ${r} ${r} 0 0 ${sweep} ${e.x} ${e.y}`,
    fill: 'none', stroke: '#ea580c', 'stroke-width': 2, ...attrs
  }, parent);
}

/* ============ 分层容器 ============ */
const gBase = el('g', {id:'gBase'}, stage);
const gStep = el('g', {id:'gStep'}, stage);
const gPts  = el('g', {id:'gPts'}, stage);

const BLUE = '#2563eb', GREEN = '#059669', RED = '#dc2626',
      PURPLE = '#7c3aed', CYAN = '#0891b2', ORANGE = '#ea580c',
      GRAY = '#94a3b8', SLATE = '#334155';

function drawBase(){
  gBase.innerHTML = '';
  // 三角形 ABC 轮廓
  polygon([ptA, ptB, ptC], {fill:'rgba(248, 250, 252, 0.4)', stroke:SLATE, 'stroke-width':2.2}, gBase);

  // 垂线段 LE, LF
  line(ptL, ptE, {stroke:'#64748b', 'stroke-width':1.5}, gBase);
  line(ptL, ptF, {stroke:'#64748b', 'stroke-width':1.5}, gBase);
  rightAngleMark(ptE, ptL, ptA, 11, '#64748b', gBase);
  rightAngleMark(ptF, ptL, ptA, 11, '#64748b', gBase);

  // 两圆 ABE 与 ACF 柔和保留轮廓
  circle(ptO1, r1, {stroke:BLUE, 'stroke-width':1.4, opacity:0.35, 'stroke-dasharray':'4 3'}, gBase);
  circle(ptO2, r2, {stroke:GREEN, 'stroke-width':1.4, opacity:0.35, 'stroke-dasharray':'4 3'}, gBase);

  // 底边中点刻度线 BL = CL
  tickMarks(ptB, ptL, '#64748b', 1, gBase);
  tickMarks(ptL, ptC, '#64748b', 1, gBase);
}

function drawPoints(showMN = false){
  gPts.innerHTML = '';

  // 基础顶点与关键点（微调偏移，避免任何几何遮挡）
  dot(ptA, SLATE, 4.5, gPts);
  label(ptA, 'A', 0, -18, SLATE, gPts);

  dot(ptB, SLATE, 4.5, gPts);
  label(ptB, 'B', -16, 14, SLATE, gPts);

  dot(ptC, SLATE, 4.5, gPts);
  label(ptC, 'C', 16, 14, SLATE, gPts);

  // 中点 L 偏右上方，与下方垂足 H 完全错开
  dot(ptL, SLATE, 4, gPts);
  label(ptL, 'L', 14, -14, SLATE, gPts);

  dot(ptE, SLATE, 4, gPts);
  label(ptE, 'E', 15, -10, SLATE, gPts);

  dot(ptF, SLATE, 4, gPts);
  label(ptF, 'F', -15, -10, SLATE, gPts);

  dot(ptP, RED, 4.5, gPts);
  label(ptP, 'P', 0, 18, RED, gPts);

  if (showMN) {
    dot(ptM, BLUE, 4.5, gPts);
    label(ptM, 'M', -16, 14, BLUE, gPts);

    dot(ptN, GREEN, 4.5, gPts);
    label(ptN, 'N', 16, 14, GREEN, gPts);
  }
}

/* ============ 各步骤动态画面 ============ */
function renderStep(s){
  gStep.innerHTML = '';
  switch(s){
    case 0:
      // Step 0: 已知条件与几何构形
      drawPoints(false);
      // 提示待求证线段 AP
      segDashed(ptA, ptP, RED, 2, gStep);
      break;

    case 1:
      // Step 1: 作辅助直径 AM, AN，得出 AP ⊥ MN
      drawPoints(true);
      // 圆心与直径 AM, AN
      dot(ptO1, BLUE, 3.5, gStep);
      label(ptO1, 'O₁', -16, -2, BLUE, gStep, 13, false);
      dot(ptO2, GREEN, 3.5, gStep);
      label(ptO2, 'O₂', 16, -2, GREEN, gStep, 13, false);

      segDashed(ptA, ptM, BLUE, 2.2, gStep);
      segDashed(ptA, ptN, GREEN, 2.2, gStep);

      // 直线 MN
      line(ptM, ptN, {stroke:PURPLE, 'stroke-width':2.4}, gStep);
      // 垂直线段 AP
      highlightSeg(ptA, ptP, RED, gStep, 3);
      // 直径所对直角：∠APM = 90° 与 ∠APN = 90°
      rightAngleMark(ptP, ptA, ptM, 13, BLUE, gStep);
      rightAngleMark(ptP, ptA, ptN, 13, GREEN, gStep);
      break;

    case 2:
      // Step 2: 发现三点共线 E-L-M 与 F-L-N
      drawPoints(true);
      // 直径 AM, AN
      segDashed(ptA, ptM, BLUE, 1.6, gStep);
      segDashed(ptA, ptN, GREEN, 1.6, gStep);
      line(ptA, ptE, {stroke:SLATE, 'stroke-width':1.8}, gStep);
      line(ptA, ptF, {stroke:SLATE, 'stroke-width':1.8}, gStep);

      // 直线 ELM 贯通
      line(ptE, ptM, {stroke:ORANGE, 'stroke-width':2.6}, gStep);
      rightAngleMark(ptE, ptA, ptM, 13, ORANGE, gStep);

      // 直线 FLN 贯通
      line(ptF, ptN, {stroke:CYAN, 'stroke-width':2.6}, gStep);
      rightAngleMark(ptF, ptA, ptN, 13, CYAN, gStep);

      // 强调公共中点 L 的交汇
      dot(ptL, ORANGE, 5, gStep);
      break;

    case 3:
      // Step 3: 连结 BM, CN 并完成角导引
      drawPoints(true);
      // 保持共线骨架
      line(ptE, ptM, {stroke:ORANGE, 'stroke-width':1.6, opacity:0.6}, gStep);
      line(ptF, ptN, {stroke:CYAN, 'stroke-width':1.6, opacity:0.6}, gStep);

      // 连结 BM 与 CN
      line(ptB, ptM, {stroke:BLUE, 'stroke-width':2.4}, gStep);
      line(ptC, ptN, {stroke:GREEN, 'stroke-width':2.4}, gStep);

      // 直径所对直角：∠ABM = 90°, ∠ACN = 90°
      rightAngleMark(ptB, ptA, ptM, 13, BLUE, gStep);
      rightAngleMark(ptC, ptA, ptN, 13, GREEN, gStep);

      // 第一组等角：∠LBM = ∠CLN = 90° - ∠B (橙色弧)
      angleArc(ptB, ptM, ptL, 22, {stroke:ORANGE, 'stroke-width':2.2}, gStep);
      angleArc(ptL, ptN, ptC, 22, {stroke:ORANGE, 'stroke-width':2.2}, gStep);

      // 第二组等角：∠BLM = ∠LCN = 90° - ∠C (紫色弧)
      angleArc(ptL, ptB, ptM, 24, {stroke:PURPLE, 'stroke-width':2.2}, gStep);
      angleArc(ptC, ptL, ptN, 24, {stroke:PURPLE, 'stroke-width':2.2}, gStep);
      break;

    case 4:
      // Step 4: 全等判定 △BLM ≅ △CLN 与对应高相等
      drawPoints(true);
      // 填充高亮两个全等三角形
      polygon([ptB, ptL, ptM], {fill:'rgba(37, 99, 235, 0.16)', stroke:BLUE, 'stroke-width':2.2}, gStep);
      polygon([ptC, ptL, ptN], {fill:'rgba(5, 150, 105, 0.16)', stroke:GREEN, 'stroke-width':2.2}, gStep);

      // 强化 BL = CL 双刻度线
      tickMarks(ptB, ptL, RED, 2, gStep);
      tickMarks(ptL, ptC, RED, 2, gStep);

      // 作垂线段 M-HM 与 N-HN 展示等高
      segDashed(ptM, ptHM, RED, 1.8, gStep);
      rightAngleMark(ptHM, ptM, ptB, 10, RED, gStep);
      dot(ptHM, RED, 3, gStep);
      label(mid(ptM, ptHM), 'h_M', -18, 0, RED, gStep, 13, false);

      segDashed(ptN, ptHN, RED, 1.8, gStep);
      rightAngleMark(ptHN, ptN, ptC, 10, RED, gStep);
      dot(ptHN, RED, 3, gStep);
      label(mid(ptN, ptHN), 'h_N', 18, 0, RED, gStep, 13, false);

      // 高度等长单刻度线
      tickMarks(ptM, ptHM, RED, 1, gStep);
      tickMarks(ptN, ptHN, RED, 1, gStep);
      break;

    case 5:
      // Step 5: 得出 MN ∥ BC 与 AP ⊥ BC
      drawPoints(true);
      // 平行线 MN 与 BC
      highlightSeg(ptB, ptC, PURPLE, gStep, 3);
      highlightSeg(ptM, ptN, PURPLE, gStep, 3);
      arrowMark(ptB, ptC, PURPLE, gStep);
      arrowMark(ptM, ptN, PURPLE, gStep);

      // 垂线 AP 贯通底边
      highlightSeg(ptA, ptP, RED, gStep, 3.8);

      // 直角标记：AP ⊥ MN 与 AP ⊥ BC
      rightAngleMark(ptP, ptA, ptN, 14, RED, gStep);
      rightAngleMark(ptH, ptA, ptC, 14, RED, gStep);

      // 垂足 H 位于偏左下方，绝不与 L 重叠
      dot(ptH, RED, 4, gStep);
      label(ptH, 'H', -14, 14, RED, gStep, 15, true);
      break;
  }

  if (typeof window.renderMath === 'function') window.renderMath();
}

/* ============ 步骤文字内容 ============ */
const steps = [
  {
    title: '已知条件与几何构形',
    body: `在 $\\bigtriangleup ABC$ 中，已知：<br>
    • $L$ 是底边 $BC$ 的中点，即 <span style="color:#2563eb"><b>$BL = CL$</b></span>；<br>
    • $E, F$ 分别是 $L$ 在边 $AC, AB$ 上的垂足射影（$LE \\bot AC, LF \\bot AB$）；<br>
    • 圆 $ABE$ 与圆 $ACF$ 交于顶点 $A$ 与另一点 $P$。<br>
    <div class="formula-box"><b>求证目标</b>：公共弦割线 <span style="color:#dc2626"><b>$AP \\bot BC$</b></span></div>`
  },
  {
    title: '① 作直径 $AM, AN$，将垂直转化为平行',
    body: `分别作圆 $ABE$ 的直径 <span style="color:#2563eb"><b>$AM$</b></span> 与圆 $ACF$ 的直径 <span style="color:#059669"><b>$AN$</b></span>：<br>
    • 由直径所对圆周角为直角：$\\angle APM = 90^\\circ$ 且 $\\angle APN = 90^\\circ$；<br>
    • 两角之和 $\\angle APM + \\angle APN = 180^\\circ$，故 <span style="color:#7c3aed"><b>$P, M, N$ 三点共线</b></span>，且 <span style="color:#dc2626"><b>$AP \\bot MN$</b></span>；<br>
    <div class="formula-box"><b>目标转化</b>：要证 $AP \\bot BC$，只需证明 <span style="color:#7c3aed"><b>$MN \\parallel BC$</b></span></div>`
  },
  {
    title: '② 利用直径与射影垂直，发现三点共线',
    body: `分析点 $M, N$ 的几何位置：<br>
    • 在圆 $ABE$ 中，直径所对圆周角 $\\angle AEM = 90^\\circ$；又已知 $LE \\bot AC$（$\\angle AEL = 90^\\circ$）；<br>
    • 过点 $E$ 垂直于 $AC$ 的直线唯一，因此 <span style="color:#ea580c"><b>$E, L, M$ 三点共线</b></span>（$M$ 落在直线 $LE$ 延长线上）；<br>
    • 同理，$\\angle AFN = \\angle AFL = 90^\\circ$，因此 <span style="color:#0891b2"><b>$F, L, N$ 三点共线</b></span>（$N$ 落在直线 $LF$ 延长线上）。`
  },
  {
    title: '③ 连结 $BM, CN$，完成角度导引',
    body: `连结辅助线段 $BM$ 与 $CN$：<br>
    • 因 $AM$ 为直径，$\\angle ABM = 90^\\circ$，故 $\\angle LBM = 90^\\circ - \\angle B$；<br>
    • 在直角 $\\triangle BFL$ 中，$\\angle FLB = 90^\\circ - \\angle B$；由对顶角知 $\\angle CLN = \\angle FLB$；<br>
    <div class="formula-box">第一组等角：<span style="color:#ea580c"><b>$\\angle LBM = \\angle CLN = 90^\\circ - \\angle B$</b></span></div>
    • 同理，在圆 $ACF$ 中，$\\angle ACN = 90^\\circ$，由余角与对顶角变换：<br>
    <div class="formula-box">第二组等角：<span style="color:#7c3aed"><b>$\\angle BLM = \\angle LCN = 90^\\circ - \\angle C$</b></span></div>`
  },
  {
    title: '④ 判定 $\\triangle BLM \\cong \\triangle CLN$，对应高相等',
    body: `观察由中点 $L$ 对称展开的两个三角形 $\\triangle BLM$ 与 $\\triangle CLN$：<br>
    • $\\angle BLM = \\angle LCN$（Step 3 已证）；<br>
    • $BL = CL$（$L$ 是 $BC$ 中点）；<br>
    • $\\angle LBM = \\angle CLN$（Step 3 已证）；<br>
    由角边角（ASA）公理，知 <span style="color:#2563eb"><b>$\\triangle BLM \\cong \\triangle CLN$</b></span>！<br>
    <div class="formula-box">全等三角形对应高相等：<span style="color:#dc2626"><b>$h_M = h_N$</b></span>（点 $M, N$ 到底边 $BC$ 距离相等）</div>`
  },
  {
    title: '⑤ 推得 $MN \\parallel BC$，得出最终结论',
    body: `• 由于点 $M, N$ 到直线 $BC$ 的距离相等且位于 $BC$ 同侧，因此：<br>
    <div class="formula-box" style="text-align:center;font-size:15px;color:#7c3aed"><b>$MN \\parallel BC$</b></div>
    • 结合 Step 1 中已证的垂直关系 $AP \\bot MN$：<br>
    • 一条直线垂直于两条平行线之一，必垂直于另一条：<br>
    <div class="formula-box" style="text-align:center;font-size:15px;color:#dc2626"><b>$MN \\parallel BC \\quad \\text{且} \\quad AP \\bot MN \\implies AP \\bot BC$</b></div>
    至此，原命题全部证毕！`
  }
];

/* ============ 交互控制逻辑 ============ */
let cur = 0, timer = null;
const listEl = document.getElementById('stepList');

steps.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'step-item';
  d.innerHTML = `<div class="title"><span class="badge">${i===0?'✦':i}</span>${s.title}</div>
                 <div class="body">${s.body}</div>`;
  d.onclick = () => { stopAuto(); goTo(i); };
  listEl.appendChild(d);
});
if (typeof window.renderMath === 'function') window.renderMath(listEl);

const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnAuto = document.getElementById('btnAuto');

function goTo(i){
  cur = Math.max(0, Math.min(steps.length-1, i));
  [...listEl.children].forEach((d, k) => {
    d.classList.toggle('active', k === cur);
    d.classList.toggle('done', k < cur);
  });
  renderStep(cur);
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;
  if (listEl.children[cur]) {
    listEl.children[cur].scrollIntoView({block:'nearest', behavior:'smooth'});
  }

  if (typeof window.renderMath === 'function') window.renderMath();
  if (typeof renderMath === "function") renderMath();
}

btnPrev.onclick = () => { stopAuto(); goTo(cur-1); };
btnNext.onclick = () => { stopAuto(); goTo(cur+1); };
document.getElementById('btnReset').onclick = () => { stopAuto(); goTo(0); };

function stopAuto(){
  if (timer){ clearInterval(timer); timer = null; btnAuto.textContent = '▶ 自动'; }
}

btnAuto.onclick = () => {
  if (timer){ stopAuto(); return; }
  btnAuto.textContent = '⏸ 暂停';
  if (cur >= steps.length - 1) goTo(0);
  timer = setInterval(() => {
    if (cur >= steps.length - 1){ stopAuto(); return; }
    goTo(cur + 1);
  }, 2800);
};

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'){ stopAuto(); goTo(cur-1); }
  if (e.key === 'ArrowRight'){ stopAuto(); goTo(cur+1); }
});

drawBase();
goTo(parseInt(new URLSearchParams(location.search).get('step')) || 0);
</script>

<!-- KaTeX 动态渲染与自适应触发脚本 -->
<script>
function renderMath(target) {
  if (typeof renderMathInElement === 'function') {
    const el = (target && target.nodeType) ? target : document.body;
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      macros: {
        '\parallel': '\mathbin{/\!/}',
        '\parallelogram': '\mathbin{/\!/}',
        '\bigtriangleup': '\triangle',
        '\triangle': '\triangle'
      },
      throwOnError: false,
      strict: false
    });
  }
}
window.renderMath = renderMath;
window.addEventListener('DOMContentLoaded', () => {
  renderMath();
  let mathTimer = null;
  const observer = new MutationObserver(() => {
    if (mathTimer) clearTimeout(mathTimer);
    mathTimer = setTimeout(() => renderMath(), 30);
  });
  observer.observe(document.body, { childList: true, subtree: true });
});
window.addEventListener('load', () => renderMath());
</script>
