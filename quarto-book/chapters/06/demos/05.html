<body>
<div class="container">
  <header>
    <div class="tag">高精度交互几何 · 射影调和与密克点定理</div>
    <h1>题目 06/5（例 4）：极点极线与密克点判定共圆</h1>
    <p><b>已知</b>：圆 <span class="math">O</span> 为 <span class="math">△ABC</span> 的外接圆，点 <span class="math">K</span> 在边 <span class="math">BC</span> 上且不为中点，<span class="math">D</span> 为 <span class="math">AK</span> 延长线上一点，<span class="math">AB</span> 与 <span class="math">CD</span> 的延长线交于点 <span class="math">E</span>，<span class="math">AC</span> 与 <span class="math">BD</span> 的延长线交于点 <span class="math">F</span>，且 <span class="math">OK ⊥ EF</span>。<br>
       <b>求证</b>：点 <span class="math">D</span> 在圆 <span class="math">O</span> 上。</p>
  </header>
  <div class="main">
    <div class="canvas-card">
      <svg id="stage" viewBox="0 0 780 500" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="legend">
        <span class="legend-item"><span class="legend-dot" style="background:#2563eb;"></span>直线 EF 与对角交点</span>
        <span class="legend-item"><span class="legend-dot" style="background:#dc2626;"></span>垂直线 OK ⊥ EF 及垂足 H</span>
        <span class="legend-item"><span class="legend-dot" style="background:#059669;"></span>共圆 ⊙(OBHC)</span>
        <span class="legend-item"><span class="legend-dot" style="background:#7c3aed;"></span>共圆 ⊙(AEHC) / 调和列</span>
        <span class="legend-item"><span class="legend-dot" style="background:#ea580c;"></span>密克圆 ⊙(CDHF)</span>
      </div>
    </div>

      <div class="step-list" id="stepList"></div>
      <div class="controls">
        <button class="btn-ghost" id="btnPrev">◀ 上一步</button>

    </div>

<script>
/* ============ 几何与向量计算 ============ */
const sub = (p,q) => ({x:p.x-q.x, y:p.y-q.y});
const add = (p,q) => ({x:p.x+q.x, y:p.y+q.y});
const mul = (p,k) => ({x:p.x*k, y:p.y*k});
const mid = (p,q) => ({x:(p.x+q.x)/2, y:(p.y+q.y)/2});
const len = p => Math.hypot(p.x, p.y);
const dist = (p,q) => len(sub(p,q));
const norm = p => { const l = len(p); return l === 0 ? {x:0, y:0} : {x:p.x/l, y:p.y/l}; };
const perp = d => ({x:-d.y, y:d.x});

function lineIntersect(p1, d1, p2, d2){
  const det = d1.x*(-d2.y) - (-d2.x)*d1.y;
  if (Math.abs(det) < 1e-9) return null;
  const t = ((p2.x-p1.x)*(-d2.y) - (-d2.x)*(p2.y-p1.y)) / det;
  return add(p1, mul(d1, t));
}

function circle3Pts(p1, p2, p3){
  const d12 = sub(p2, p1), m12 = mid(p1, p2), n12 = {x:-d12.y, y:d12.x};
  const d23 = sub(p3, p2), m23 = mid(p2, p3), n23 = {x:-d23.y, y:d23.x};
  const det = n12.x*(-n23.y) - (-n23.x)*n12.y;
  if (Math.abs(det) < 1e-9) return null;
  const t = ((m23.x - m12.x)*(-n23.y) - (-n23.x)*(m23.y - m12.y)) / det;
  const center = add(m12, mul(n12, t));
  return { center, radius: dist(center, p1) };
}

/* ============ 绝对精确几何坐标系统 ============ */
const O = { x: 400.00, y: 230.00 };
const R = 140.00;

// 三角形 ABC 与点 D 在外接圆 O 上的精确解析坐标
const A = { x: 301.01, y: 131.01 };
const B = { x: 319.70, y: 344.68 };
const C = { x: 521.24, y: 300.00 };
const D = { x: 412.20, y: 369.47 };

// 完全四边形交点
const E = lineIntersect(A, sub(B, A), C, sub(D, C)); // AB 与 CD 延长线交点: (326.64, 423.98)
const F = lineIntersect(A, sub(C, A), B, sub(D, B)); // AC 与 BD 延长线交点: (718.86, 451.64)
const K = lineIntersect(A, sub(D, A), B, sub(C, B)); // AD 与 BC 交点: (393.06, 328.42)
const G = lineIntersect(B, sub(C, B), E, sub(F, E)); // BC 与 EF 延长线交点: (50.00, 404.47)
const H = lineIntersect(O, sub(K, O), E, sub(F, E)); // OK 与 EF 垂足: (386.03, 428.17)

// 辅助共圆精确圆心与半径
const cOBHC = circle3Pts(O, B, C); // { center: (422.43, 331.16), radius: 103.61 }
const cABHF = circle3Pts(A, B, F); // { center: (568.28, 215.28), radius: 280.25 }
const cAEHC = circle3Pts(A, E, C); // { center: (367.14, 272.83), radius: 156.48 }
const cCDHF = circle3Pts(C, D, F); // { center: (550.58, 466.36), radius: 168.93 }
const cBDHE = circle3Pts(B, D, E); // { center: (359.50, 381.15), radius: 53.98 }

/* ============ SVG 绘图工具 ============ */
const NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById('stage');

function el(tag, attrs = {}, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function line(p, q, attrs, parent){
  return el('line', {x1:p.x, y1:p.y, x2:q.x, y2:q.y, ...attrs}, parent);
}
function segDashed(p, q, color, w=1.8, parent){
  return line(p, q, {stroke:color, 'stroke-width':w, 'stroke-dasharray':'6 4', fill:'none'}, parent);
}
function circle(c, r, attrs = {}, parent){
  return el('circle', {cx:c.x, cy:c.y, r, fill:'none', ...attrs}, parent);
}
function dot(p, color, r=4.5, parent){
  return el('circle', {cx:p.x, cy:p.y, r, fill:color, stroke:'#fff', 'stroke-width':1.5}, parent);
}
function polygon(pts, attrs = {}, parent){
  return el('polygon', {points: pts.map(p=>`${p.x},${p.y}`).join(' '), ...attrs}, parent);
}
function label(p, text, dx=0, dy=0, color='#0f172a', parent, size=16, bold=true){
  const t = el('text', {
    x: p.x + dx, y: p.y + dy,
    'font-size': size, fill: color,
    'text-anchor': 'middle', 'dominant-baseline': 'central',
    'font-family': '"Times New Roman", STIX Two Math, serif',
    'font-style': 'italic',
    'font-weight': bold ? '700' : '400',
    'stroke': '#ffffff', 'stroke-width': '3.5', 'stroke-linejoin': 'round',
    'paint-order': 'stroke fill'
  }, parent);
  t.textContent = text;
  return t;
}
function rightAngleMark(v, p1, p2, s=11, color='#dc2626', parent){
  const u1 = norm(sub(p1,v)), u2 = norm(sub(p2,v));
  const a = add(v, mul(u1,s)), b = add(add(v, mul(u1,s)), mul(u2,s)), c = add(v, mul(u2,s));
  return el('polyline', {points:`${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y}`,
    fill:'none', stroke:color, 'stroke-width':1.8}, parent);
}
function tickMark(p, q, color, parent, offset=0){
  const m = mid(p,q), d = norm(sub(q,p)), n = perp(d);
  const c = add(m, mul(d, offset));
  line(add(c, mul(n,5.5)), add(c, mul(n,-5.5)), {stroke:color, 'stroke-width':2.2}, parent);
}
function highlightSeg(p, q, color, parent, w=3.5){
  line(p, q, {stroke:color, 'stroke-width':w+6, 'stroke-linecap':'round', opacity:.18}, parent);
  line(p, q, {stroke:color, 'stroke-width':w, 'stroke-linecap':'round'}, parent);
}
function angleArc(v, p1, p2, r=20, attrs={}, parent){
  const a1 = Math.atan2(p1.y - v.y, p1.x - v.x);
  let a2 = Math.atan2(p2.y - v.y, p2.x - v.x);
  let da = a2 - a1;
  while (da < 0) da += Math.PI * 2;
  const sweep = da <= Math.PI ? 1 : 0;
  const s = { x: v.x + r * Math.cos(a1), y: v.y + r * Math.sin(a1) };
  const e = { x: v.x + r * Math.cos(a2), y: v.y + r * Math.sin(a2) };
  return el('path', {
    d: `M ${s.x} ${s.y} A ${r} ${r} 0 0 ${sweep} ${e.x} ${e.y}`,
    fill: 'none', stroke: '#dc2626', 'stroke-width': 1.8, ...attrs
  }, parent);
}

/* ============ 三层 SVG 架构 ============ */
const gBase = el('g', {id: 'gBase'}, stage); // 底层：静态基础图元
const gStep = el('g', {id: 'gStep'}, stage); // 中层：动态交互图元（每步重绘）
const gPts  = el('g', {id: 'gPts'}, stage);  // 顶层：点与白底防遮挡标签

const BLUE = '#2563eb', GREEN = '#059669', RED = '#dc2626',
      PURPLE = '#7c3aed', CYAN = '#0891b2', ORANGE = '#ea580c';

function drawBase(){
  gBase.innerHTML = '';
  // 1. 外接圆 O (半透明底色 + 浅蓝灰色边界)
  circle(O, R, {stroke: '#94a3b8', 'stroke-width': 1.8, fill: '#f8fafc', 'fill-opacity': 0.4}, gBase);

  // 2. 三角形 ABC
  polygon([A, B, C], {fill: 'rgba(241, 245, 249, 0.45)', stroke: '#334155', 'stroke-width': 2}, gBase);

  // 3. 射线 AD (过 K 到 D)
  line(A, D, {stroke: '#334155', 'stroke-width': 1.8}, gBase);

  // 4. 延长线及完全四边形各线段
  // 延长线 BE (虚线) 与 CD 延长至 E (虚线)
  segDashed(B, E, '#64748b', 1.5, gBase);
  segDashed(C, E, '#64748b', 1.5, gBase);

  // 延长线 CF (虚线) 与 BD 延长至 F (虚线)
  segDashed(C, F, '#64748b', 1.5, gBase);
  segDashed(D, F, '#64748b', 1.5, gBase);
  line(B, D, {stroke: '#334155', 'stroke-width': 1.6}, gBase);

  // 直线 EF 及向 G 的延长线
  line(G, F, {stroke: BLUE, 'stroke-width': 2, opacity: 0.85}, gBase);

  // 直线 CB 向 G 的延长线
  segDashed(B, G, '#64748b', 1.5, gBase);

  // 垂线段 OK 及其延长至 H
  line(O, H, {stroke: '#64748b', 'stroke-width': 1.8, 'stroke-dasharray': '5 3'}, gBase);
}

function drawPoints(){
  gPts.innerHTML = '';

  // 绘制各个点
  dot(O, '#475569', 4, gPts);
  dot(A, '#0f172a', 4.5, gPts);
  dot(B, '#0f172a', 4.5, gPts);
  dot(C, '#0f172a', 4.5, gPts);
  dot(D, RED, 4.5, gPts);
  dot(K, PURPLE, 4, gPts);
  dot(E, BLUE, 4.5, gPts);
  dot(F, BLUE, 4.5, gPts);
  dot(G, PURPLE, 4.5, gPts);
  dot(H, RED, 4.5, gPts);

  // 绘制防遮挡标签 (微调偏移量避免压盖引线与顶点)
  label(O, 'O', 16, -12, '#475569', gPts);
  label(A, 'A', -12, -14, '#0f172a', gPts);
  label(B, 'B', -18, -4, '#0f172a', gPts);
  label(C, 'C', 18, -6, '#0f172a', gPts);
  label(D, 'D', 16, 14, RED, gPts);
  label(K, 'K', -16, -12, PURPLE, gPts);
  label(E, 'E', -16, 14, BLUE, gPts);
  label(F, 'F', 16, 14, BLUE, gPts);
  label(G, 'G', -18, -6, PURPLE, gPts);
  label(H, 'H', 2, 18, RED, gPts);
}

/* ============ 各步骤动态图元渲染 ============ */
function renderStep(s){
  gStep.innerHTML = ''; // 切换时彻底清空步骤层，实现辅助线随用随画随擦

  switch(s){
    case 0: // 步骤 0：已知条件与几何图景
      // 高亮 OK ⊥ EF 条件与垂足 H
      highlightSeg(O, H, RED, gStep, 3);
      highlightSeg(E, F, BLUE, gStep, 3);
      rightAngleMark(H, K, F, 12, RED, gStep);
      break;

    case 1: // 步骤 1：调和点列与角平分线
      // 高亮完全四边形对角线 BC 上的调和点列 G, B, K, C
      highlightSeg(G, C, PURPLE, gStep, 3.5);
      dot(G, PURPLE, 6, gStep);
      dot(B, PURPLE, 6, gStep);
      dot(K, PURPLE, 6, gStep);
      dot(C, PURPLE, 6, gStep);

      // 连接 HB 与 HC
      line(H, B, {stroke: PURPLE, 'stroke-width': 2.2}, gStep);
      line(H, C, {stroke: PURPLE, 'stroke-width': 2.2}, gStep);
      line(H, G, {stroke: BLUE, 'stroke-width': 2.2}, gStep);
      line(H, K, {stroke: RED, 'stroke-width': 2.2}, gStep);

      // 直角标记 ∠GHK = 90°
      rightAngleMark(H, G, K, 12, RED, gStep);

      // 角平分线标记：∠BHO = ∠CHO
      angleArc(H, B, K, 24, {stroke: RED, 'stroke-width': 2}, gStep);
      angleArc(H, K, C, 28, {stroke: RED, 'stroke-width': 2}, gStep);
      break;

    case 2: // 步骤 2：外心等距与 O, B, H, C 四点共圆
      // 绘制辅助圆 ⊙(OBHC)
      circle(cOBHC.center, cOBHC.radius, {
        stroke: GREEN, 'stroke-width': 2.2, 'stroke-dasharray': '6 4',
        fill: 'rgba(5, 150, 105, 0.07)'
      }, gStep);

      // 高亮外心半径 OB 与 OC
      highlightSeg(O, B, GREEN, gStep, 3);
      highlightSeg(O, C, GREEN, gStep, 3);
      tickMark(O, B, GREEN, gStep);
      tickMark(O, C, GREEN, gStep);

      // 保留角平分线 HB, HC, HO 骨架
      line(H, B, {stroke: '#059669', 'stroke-width': 1.8, 'stroke-dasharray': '4 3'}, gStep);
      line(H, C, {stroke: '#059669', 'stroke-width': 1.8, 'stroke-dasharray': '4 3'}, gStep);
      line(H, O, {stroke: RED, 'stroke-width': 2}, gStep);

      // 高亮共圆的四点
      [O, B, H, C].forEach(p => dot(p, GREEN, 6, gStep));
      break;

    case 3: // 步骤 3：圆周角转移与 A, B, H, F 共圆
      // 淡化保留 ⊙(OBHC)
      circle(cOBHC.center, cOBHC.radius, {stroke: '#86efac', 'stroke-width': 1.4, 'stroke-dasharray': '4 4'}, gStep);

      // 绘制新确立的外接圆 ⊙(ABHF) 与 ⊙(AEHC)
      circle(cABHF.center, cABHF.radius, {
        stroke: BLUE, 'stroke-width': 2.2, 'stroke-dasharray': '7 5',
        fill: 'rgba(37, 99, 235, 0.05)'
      }, gStep);
      circle(cAEHC.center, cAEHC.radius, {
        stroke: PURPLE, 'stroke-width': 1.8, 'stroke-dasharray': '6 4',
        fill: 'rgba(124, 58, 237, 0.04)'
      }, gStep);

      // 直角 ∠EHO = 90° 标记
      rightAngleMark(H, E, O, 12, RED, gStep);

      // 连线 HB, OC, HF
      line(H, B, {stroke: '#334155', 'stroke-width': 1.8}, gStep);
      line(O, C, {stroke: '#334155', 'stroke-width': 1.8}, gStep);
      line(H, F, {stroke: BLUE, 'stroke-width': 2}, gStep);

      // 高亮关键相等角：∠EHB = ∠BAC
      angleArc(H, E, B, 24, {stroke: RED, 'stroke-width': 2.4}, gStep);
      angleArc(A, B, C, 26, {stroke: RED, 'stroke-width': 2.4}, gStep);

      // 高亮共圆的四点 A, B, H, F
      [A, B, H, F].forEach(p => dot(p, BLUE, 6, gStep));
      break;

    case 4: // 步骤 4：密克点定理与 C, D, H, F & B, D, H, E 共圆
      // 绘制密克圆 ⊙(CDHF) 与 ⊙(BDHE)
      circle(cCDHF.center, cCDHF.radius, {
        stroke: ORANGE, 'stroke-width': 2.2, 'stroke-dasharray': '6 4',
        fill: 'rgba(234, 88, 12, 0.06)'
      }, gStep);
      circle(cBDHE.center, cBDHE.radius, {
        stroke: CYAN, 'stroke-width': 2.2, 'stroke-dasharray': '6 4',
        fill: 'rgba(8, 145, 178, 0.06)'
      }, gStep);

      // 连线 HD (连接密克点 H 与待定点 D)
      line(H, D, {stroke: RED, 'stroke-width': 2.2}, gStep);
      line(C, D, {stroke: ORANGE, 'stroke-width': 2}, gStep);
      line(B, D, {stroke: CYAN, 'stroke-width': 2}, gStep);

      // 密克点 H 显著高亮 (四圆共点枢纽)
      circle(H, 9, {stroke: RED, 'stroke-width': 2, fill: 'none'}, gStep);
      dot(H, RED, 6, gStep);
      dot(D, RED, 6, gStep);

      // 展示关键等角：∠ABD = ∠EHD = ∠DCF
      angleArc(B, A, D, 22, {stroke: CYAN, 'stroke-width': 2.2}, gStep);
      angleArc(H, E, D, 22, {stroke: RED, 'stroke-width': 2.2}, gStep);
      angleArc(C, D, F, 22, {stroke: ORANGE, 'stroke-width': 2.2}, gStep);
      break;

    case 5: // 步骤 5：最终判定，D 在圆 O 上
      // 高亮原外接圆 ⊙O
      circle(O, R, {stroke: '#1d4ed8', 'stroke-width': 3.2, fill: 'rgba(37, 99, 235, 0.08)'}, gStep);

      // 高亮内接四边形 ABDC
      polygon([A, B, D, C], {stroke: '#2563eb', 'stroke-width': 2.4, fill: 'none'}, gStep);

      // 高亮由圆周角确立的相等角：∠ABD 与 ∠DCF (外角等于内对角 ⇒ 对角互补)
      angleArc(B, A, D, 22, {stroke: RED, 'stroke-width': 2.5}, gStep);
      angleArc(C, D, F, 22, {stroke: RED, 'stroke-width': 2.5}, gStep);

      // 终点 D 闪耀高亮
      circle(D, 11, {stroke: RED, 'stroke-width': 2.5, fill: 'none'}, gStep);
      dot(D, RED, 6.5, gStep);
      [A, B, C].forEach(p => dot(p, '#1d4ed8', 5, gStep));
      break;
  }
  if (typeof renderMath === 'function') { renderMath(); }
}

/* ============ 交互控制系统 ============ */
let cur = 0, timer = null;
const listEl = document.getElementById('stepList');

steps.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'step-item';
  d.innerHTML = `<div class="title"><span class="badge">${i===0?'✦':i}</span>${s.title}</div>
                 <div class="body">${s.body}</div>`;
  d.onclick = () => { stopAuto(); goTo(i); };
  listEl.appendChild(d);
});

const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnAuto = document.getElementById('btnAuto');

function goTo(i){
  cur = Math.max(0, Math.min(steps.length-1, i));
  [...listEl.children].forEach((d, k) => {
    d.classList.toggle('active', k === cur);
    d.classList.toggle('done', k < cur);
  });
  renderStep(cur);
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;
  if (listEl.children[cur]) {
    listEl.children[cur].scrollIntoView({block:'nearest', behavior:'smooth'});
  }
  if (typeof renderMath === 'function') { renderMath(); }
  if (typeof renderMath === "function") renderMath();
}

btnPrev.onclick = () => { stopAuto(); goTo(cur-1); };
btnNext.onclick = () => { stopAuto(); goTo(cur+1); };
document.getElementById('btnReset').onclick = () => { stopAuto(); goTo(0); };

function stopAuto(){
  if (timer){ clearInterval(timer); timer = null; btnAuto.textContent = '▶ 自动'; }
}

btnAuto.onclick = () => {
  if (timer){ stopAuto(); return; }
  btnAuto.textContent = '⏸ 暂停';
  if (cur >= steps.length - 1) goTo(0);
  timer = setInterval(() => {
    if (cur >= steps.length - 1){ stopAuto(); return; }
    goTo(cur + 1);
  }, 3200);
};

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'){ stopAuto(); goTo(cur-1); }
  if (e.key === 'ArrowRight'){ stopAuto(); goTo(cur+1); }
});

// 初始化静态图层与点
drawBase();
drawPoints();

// 支持 URL 参数直达某步，默认第 0 步
const urlStep = parseInt(new URLSearchParams(location.search).get('step'));
goTo(!isNaN(urlStep) ? urlStep : 0);

<!-- KaTeX 动态渲染与自适应触发脚本 -->
<script>
function renderMath(target) {
  if (typeof renderMathInElement === 'function') {
    const el = (target && target.nodeType) ? target : document.body;
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      macros: {
        '\parallel': '\mathbin{/\!/}',
        '\parallelogram': '\mathbin{/\!/}',
        '\bigtriangleup': '\triangle',
        '\triangle': '\triangle'
      },
      throwOnError: false,
      strict: false
    });
  }
}
window.renderMath = renderMath;
window.addEventListener('DOMContentLoaded', () => {
  renderMath();
  let mathTimer = null;
  const observer = new MutationObserver(() => {
    if (mathTimer) clearTimeout(mathTimer);
    mathTimer = setTimeout(() => renderMath(), 30);
  });
  observer.observe(document.body, { childList: true, subtree: true });
});
window.addEventListener('load', () => renderMath());
</script>
