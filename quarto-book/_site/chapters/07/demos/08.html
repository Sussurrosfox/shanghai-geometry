<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>例 7：对称点三角形与外心三角形的面积比定理</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #7c3aed;
      --success: #059669;
      --danger: #dc2626;
      --warning: #ea580c;
      --info: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 400;
    }
    .main-container, .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .svg-container, .canvas-card {
      flex: 1.35;
      background: var(--panel-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-right: 1px solid var(--border);
      padding: 16px;
    }
    svg {
      width: 100%;
      height: 100%;
      max-height: 90vh;
      user-select: none;
    }
    .control-panel, .panel {
      flex: 0.95;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      overflow: hidden;
    }
    .steps-list, .step-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .step-card, .step-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      background: var(--bg);
      cursor: pointer;
      transition: all 0.2s ease;
      opacity: 0.72;
    }
    .step-card:hover, .step-item:hover {
      opacity: 0.95;
      border-color: #cbd5e1;
    }
    .step-card.active, .step-item.active {
      opacity: 1;
      border-color: var(--primary);
      background: #eff6ff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
    }
    .step-header, .step-item .title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text);
    }
    .step-card.active .step-header, .step-item.active .title {
      color: var(--primary);
    }
    .step-badge, .step-item .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #e2e8f0;
      color: #475569;
      font-size: 0.75rem;
      font-weight: 700;
      margin-right: 8px;
      flex: none;
    }
    .step-card.active .step-badge, .step-item.active .badge {
      background: var(--primary);
      color: #fff;
    }
    .step-body, .step-item .body {
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--text-muted);
    }
    .step-card.active .step-body, .step-item.active .body {
      color: #334155;
    }
    .bottom-bar, .controls {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel-bg);
      flex-shrink: 0;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button {
      padding: 7px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    button:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    button.primary, .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    button.primary:hover:not(:disabled), .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .step-counter, .progress {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .pt-lbl {
      font-family: "Times New Roman", "STIX Two Math", serif;
      font-size: 16px;
      font-style: italic;
      font-weight: 700;
      fill: #0f172a;
      paint-order: stroke fill;
      stroke: #ffffff;
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .math {
      font-family: "Times New Roman", "STIX Two Math", serif;
      font-style: italic;
    }
    .tag-eq {
      background: #e0e7ff;
      color: #3730a3;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.82rem;
    }
  </style>
  <!-- KaTeX 数学公式渲染引擎 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <header>
    <h1><span>📐</span> 例 7：对称点三角形与外心三角形的面积比定理</h1>
    <div class="subtitle">外心 O · 垂心 H · 点 P 对称点 D, E, F · 圆幂不变性</div>
  </header>

  <div class="main-container main">
    <div class="svg-container canvas-card">
      <svg id="stage" viewBox="140 10 570 530" preserveAspectRatio="xMidYMid meet">
        <defs>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <!-- 静态底层 -->
        <g id="gBase"></g>
        <!-- 动态单步层 -->
        <g id="gStep"></g>
        <!-- 顶层标记与文字 -->
        <g id="gPts"></g>
      </svg>
    </div>

    <div class="control-panel panel">
      <div class="steps-list step-list" id="stepList"></div>

      <div class="bottom-bar controls">
        <div class="btn-group">
          <button id="btnPrev">◀ 上一步</button>
          <button id="btnNext" class="primary btn-primary">下一步 ▶</button>
          <button id="btnAuto">▶ 自动</button>
          <button id="btnReset">重置</button>
        </div>
        <div class="step-counter progress" id="stepCounter">第 0 / 6 步</div>
      </div>
    </div>
  </div>

  <script>
    // 严格代数几何坐标解算常量
    const O = { x: 360.00, y: 330.00, r: 175.00 };
    const A = { x: 335.64, y: 156.70 };
    const B = { x: 211.59, y: 422.74 };
    const C = { x: 524.45, y: 389.85 };
    const H = { x: 351.68, y: 309.29 };
    const P = { x: 332.74, y: 354.34 };

    // 对称点 D, E, F
    const D = { x: 344.31, y: 464.45 };
    const E = { x: 529.57, y: 194.95 };
    const F = { x: 186.11, y: 285.97 };

    // 辅助圆 AHC 圆心及割线交点 E'
    const O_ahc = { x: 500.09, y: 216.56, r: 175.00 };
    const E_prime = { x: 674.95, y: 223.63 };

    // 常用色彩常量
    const BLUE = '#2563eb', GREEN = '#059669', RED = '#dc2626',
          PURPLE = '#7c3aed', CYAN = '#0891b2', ORANGE = '#ea580c',
          SLATE = '#64748b';

    const steps = [
      {
        title: "Step 0：题设条件与几何构型",
        body: `设锐角 <span class="math">△ABC</span> 的外心为 <span class="math">O</span>，垂心为 <span class="math">H</span>。<span class="math">△ABC</span> 内部任取一点 <span class="math">P</span>，其关于三边 <span class="math">BC, CA, AB</span> 的轴对称点分别为 <span class="math">D, E, F</span>。<br><b>求证目标</b>：<span class="tag-eq">S<sub>△HDE</sub> / S<sub>△HDF</sub> = S<sub>△OAB</sub> / S<sub>△OAC</sub></span>。`
      },
      {
        title: "Step 1：构造圆 ⊙(AHC) 与割线交点 E'",
        body: `垂心 <span class="math">H</span> 关于边 <span class="math">AC</span> 的对称点在外接圆 <span class="math">⊙O</span> 上，故圆 <span class="math">⊙(AHC)</span> 恰为 <span class="math">⊙O</span> 关于直线 <span class="math">AC</span> 的对称圆，其半径亦为 <span class="math">R</span>。<br>延长射线 <span class="math">AE</span> 与圆 <span class="math">⊙(AHC)</span> 交于点 <span class="math">E'</span>。`
      },
      {
        title: "Step 2：圆周角平移导出 EF ∥ E'H",
        body: `由轴对称得 <span class="math">AP = AF = AE</span>，顶角 <span class="math">∠EAF = 2∠BAC = 2A</span>，故等腰底角 <span class="math">∠AEF = 90° - A</span>。<br>由高线知 <span class="math">∠ACH = 90° - A</span>；又在圆 <span class="math">⊙(AHC)</span> 中，同弧圆周角 <span class="math">∠AE'H = ∠ACH = 90° - A</span>。<br>同位角相等得出：<b><span style="color:#059669;">EF ∥ E'H</span></b>！`
      },
      {
        title: "Step 3：同底等高平行割补面积转换",
        body: `因为 <b><span style="color:#059669;">EF ∥ E'H</span></b>，点 <span class="math">H</span> 与点 <span class="math">E'</span> 到直线 <span class="math">EF</span> 的垂直高度严格相等。<br>利用公共底边 <span class="math">EF</span> 上的平行滑移变形，立即得到面积等式：<br><b><span style="color:#ea580c;">S<sub>△HEF</sub> = S<sub>△EE'F</sub></span></b>。<br>将垂心三角形成功转化到射线割线上的三角形！`
      },
      {
        title: "Step 4：圆幂不变性求解 S△HEF",
        body: `由正弦定理：<span class="math">S<sub>△EE'F</sub> = ½ EF · EE' · sin ∠FEA = ½ AE · EE' · sin 2A</span>。<br><b>核心几何洞察</b>：<span class="math">E</span> 与圆 <span class="math">⊙(AHC)</span> 是点 <span class="math">P</span> 与外接圆 <span class="math">⊙O</span> 关于边 <span class="math">AC</span> 的轴对称图形！<br>因此割线幂之积 <span class="math">AE · EE'</span> 严格等于点 <span class="math">P</span> 对圆 <span class="math">⊙O</span> 的圆幂绝对值 <span class="math">I<sub>P</sub> = |R² - OP²|</span>！<br>故 <b><span style="color:#2563eb;">S<sub>△HEF</sub> = ½ · I<sub>P</sub> · sin 2A</span></b>。`
      },
      {
        title: "Step 5：三边对称轮换导出面积闭式",
        body: `完全同理，关于边 <span class="math">BC</span>（对应顶角 <span class="math">C</span>）与边 <span class="math">AB</span>（对应顶角 <span class="math">B</span>）分别进行平行割补与圆幂映射，立即得到：<br><b><span style="color:#0284c7;">S<sub>△HDE</sub> = ½ · I<sub>P</sub> · sin 2C</span></b>，<br><b><span style="color:#7c3aed;">S<sub>△HDF</sub> = ½ · I<sub>P</sub> · sin 2B</span></b>。<br>两式作比消去圆幂因子：<b>S<sub>△HDE</sub> / S<sub>△HDF</sub> = sin 2C / sin 2B</b>。`
      },
      {
        title: "Step 6：外心三角形面积与最终命题得证",
        body: `在外接圆 <span class="math">⊙O</span> 中，半径 <span class="math">OA = OB = OC = R</span>。圆心角 <span class="math">∠AOB = 2C, ∠AOC = 2B</span>。<br>故外心三角形面积为：<br><span class="math">S<sub>△OAB</sub> = ½ R² sin 2C</span>，<span class="math">S<sub>△OAC</sub> = ½ R² sin 2B</span>。<br>两式作比消去 <span class="math">½ R²</span> 同样得到 <b>sin 2C / sin 2B</b>！<br><b>综合结论</b>：<span class="tag-eq">S<sub>△HDE</sub> / S<sub>△HDF</sub> = S<sub>△OAB</sub> / S<sub>△OAC</sub></span>，原命题完美得证！`
      }
    ];

    let currentStep = 0;
    let timer = null;

    const gBase = document.getElementById('gBase');
    const gStep = document.getElementById('gStep');
    const gPts = document.getElementById('gPts');
    const stepList = document.getElementById('stepList');
    const stepCounter = document.getElementById('stepCounter');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnAuto = document.getElementById('btnAuto');
    const btnReset = document.getElementById('btnReset');

    function createSvgElement(tag, attrs) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [k, v] of Object.entries(attrs)) {
        el.setAttribute(k, v);
      }
      return el;
    }

    // 向量与几何辅助工具
    const sub = (p, q) => ({ x: p.x - q.x, y: p.y - q.y });
    const add = (p, q) => ({ x: p.x + q.x, y: p.y + q.y });
    const mul = (p, k) => ({ x: p.x * k, y: p.y * k });
    const len = p => Math.hypot(p.x, p.y);
    const norm = p => { const l = len(p); return l === 0 ? {x:0, y:0} : {x:p.x/l, y:p.y/l}; };
    const perp = d => ({ x: -d.y, y: d.x });

    // 角弧线
    function angleArc(v, p1, p2, r=22, attrs={}, parent=gStep) {
      const a1 = Math.atan2(p1.y - v.y, p1.x - v.x);
      let a2 = Math.atan2(p2.y - v.y, p2.x - v.x);
      let da = a2 - a1;
      while (da < 0) da += Math.PI * 2;
      const sweep = da <= Math.PI ? 1 : 0;
      const s = { x: v.x + r * Math.cos(a1), y: v.y + r * Math.sin(a1) };
      const e = { x: v.x + r * Math.cos(a2), y: v.y + r * Math.sin(a2) };
      return parent.appendChild(createSvgElement('path', {
        d: `M ${s.x} ${s.y} A ${r} ${r} 0 0 ${sweep} ${e.x} ${e.y}`,
        fill: 'none', stroke: '#dc2626', 'stroke-width': '1.8', ...attrs
      }));
    }

    // 平行箭头
    function arrowMark(p, q, color=GREEN, parent=gStep) {
      const m = { x: (p.x + q.x)/2, y: (p.y + q.y)/2 };
      const d = norm(sub(q, p)), n = perp(d);
      const tip = add(m, mul(d, 8));
      const p1 = add(add(m, mul(d, -6)), mul(n, 5));
      const p2 = add(add(m, mul(d, -6)), mul(n, -5));
      return parent.appendChild(createSvgElement('polygon', {
        points: `${tip.x},${tip.y} ${p1.x},${p1.y} ${p2.x},${p2.y}`,
        fill: color
      }));
    }

    // 等长双杠刻度
    function tickMark2(p, q, color=ORANGE, parent=gStep) {
      const m = { x: (p.x + q.x)/2, y: (p.y + q.y)/2 };
      const d = norm(sub(q, p)), n = perp(d);
      [-3.5, 3.5].forEach(off => {
        const c = add(m, mul(d, off));
        parent.appendChild(createSvgElement('line', {
          x1: c.x + n.x * 5, y1: c.y + n.y * 5,
          x2: c.x - n.x * 5, y2: c.y - n.y * 5,
          stroke: color, 'stroke-width': '2'
        }));
      });
    }

    // 静态底层渲染
    function renderBase() {
      gBase.innerHTML = '';

      // △ABC 填充与边框
      gBase.appendChild(createSvgElement('polygon', {
        points: `${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}`,
        fill: '#f1f5f9', 'fill-opacity': '0.6',
        stroke: '#475569', 'stroke-width': '2'
      }));

      // 对称垂线迹 (P 到各边投影及延长到 D, E, F 的虚线)
      gBase.appendChild(createSvgElement('line', {
        x1: P.x, y1: P.y, x2: D.x, y2: D.y,
        stroke: '#94a3b8', 'stroke-width': '1.3', 'stroke-dasharray': '3,3'
      }));
      gBase.appendChild(createSvgElement('line', {
        x1: P.x, y1: P.y, x2: E.x, y2: E.y,
        stroke: '#94a3b8', 'stroke-width': '1.3', 'stroke-dasharray': '3,3'
      }));
      gBase.appendChild(createSvgElement('line', {
        x1: P.x, y1: P.y, x2: F.x, y2: F.y,
        stroke: '#94a3b8', 'stroke-width': '1.3', 'stroke-dasharray': '3,3'
      }));
    }

    // 顶层点与文字渲染
    function renderPoints(stepIdx) {
      gPts.innerHTML = '';

      // 所有候选点定义
      const pts = [
        { pt: A, name: 'A', dx: 0, dy: -18, col: '#0f172a' },
        { pt: B, name: 'B', dx: -18, dy: 14, col: '#0f172a' },
        { pt: C, name: 'C', dx: 18, dy: 14, col: '#0f172a' },
        { pt: O, name: 'O', dx: 16, dy: -4, col: '#0284c7' },
        { pt: H, name: 'H', dx: -16, dy: -12, col: '#7c3aed' },
        { pt: P, name: 'P', dx: -16, dy: 14, col: '#ea580c' },
        { pt: D, name: 'D', dx: 0, dy: 22, col: '#64748b' },
        { pt: E, name: 'E', dx: 16, dy: -14, col: '#64748b' },
        { pt: F, name: 'F', dx: -18, dy: -4, col: '#64748b' }
      ];

      // E' 在 step 1~4 显现
      if (stepIdx >= 1 && stepIdx <= 4) {
        pts.push({ pt: E_prime, name: "E'", dx: 18, dy: 2, col: '#059669' });
      }

      pts.forEach(p => {
        gPts.appendChild(createSvgElement('circle', {
          cx: p.pt.x, cy: p.pt.y, r: 4.5,
          fill: p.col, stroke: '#ffffff', 'stroke-width': '1.5'
        }));
        const txt = createSvgElement('text', {
          x: p.pt.x + p.dx, y: p.pt.y + p.dy,
          class: 'pt-lbl',
          'text-anchor': 'middle',
          'dominant-baseline': 'central'
        });
        txt.textContent = p.name;
        gPts.appendChild(txt);
      });
    }

    // 动态单步渲染
    function renderStep(idx) {
      gStep.innerHTML = ''; // 清空动态层

      if (idx === 0) {
        // Step 0: 题设条件构型，展示 △HDE 与 △HDF 的轮廓骨架
        gStep.appendChild(createSvgElement('polygon', {
          points: `${H.x},${H.y} ${D.x},${D.y} ${E.x},${E.y}`,
          fill: '#0284c7', 'fill-opacity': '0.08',
          stroke: '#0284c7', 'stroke-width': '1.6', 'stroke-dasharray': '5,4'
        }));
        gStep.appendChild(createSvgElement('polygon', {
          points: `${H.x},${H.y} ${D.x},${D.y} ${F.x},${F.y}`,
          fill: '#7c3aed', 'fill-opacity': '0.08',
          stroke: '#7c3aed', 'stroke-width': '1.6', 'stroke-dasharray': '5,4'
        }));

        // 提示点 P 连接各对称点的线
        gStep.appendChild(createSvgElement('line', {
          x1: A.x, y1: A.y, x2: P.x, y2: P.y,
          stroke: '#cbd5e1', 'stroke-width': '1.5', 'stroke-dasharray': '4,4'
        }));

      } else if (idx === 1) {
        // Step 1: 辅助圆 ⊙(AHC) 与割线交点 E'
        gStep.appendChild(createSvgElement('circle', {
          cx: O_ahc.x, cy: O_ahc.y, r: O_ahc.r,
          fill: '#059669', 'fill-opacity': '0.04',
          stroke: '#059669', 'stroke-width': '1.8', 'stroke-dasharray': '6,4'
        }));

        // 射线 A-E-E'
        gStep.appendChild(createSvgElement('line', {
          x1: A.x, y1: A.y, x2: E_prime.x, y2: E_prime.y,
          stroke: '#059669', 'stroke-width': '2.2'
        }));

        // 辅助虚线 E'H 与 CH
        gStep.appendChild(createSvgElement('line', {
          x1: E_prime.x, y1: E_prime.y, x2: H.x, y2: H.y,
          stroke: '#ea580c', 'stroke-width': '1.8', 'stroke-dasharray': '4,4'
        }));
        gStep.appendChild(createSvgElement('line', {
          x1: C.x, y1: C.y, x2: H.x, y2: H.y,
          stroke: '#64748b', 'stroke-width': '1.5', 'stroke-dasharray': '4,4'
        }));

      } else if (idx === 2) {
        // Step 2: 平行线 EF ∥ E'H 与圆周角平移
        // 辅助圆 ⊙(AHC)
        gStep.appendChild(createSvgElement('circle', {
          cx: O_ahc.x, cy: O_ahc.y, r: O_ahc.r,
          fill: 'none', stroke: '#cbd5e1', 'stroke-width': '1.5', 'stroke-dasharray': '5,4'
        }));

        // 等腰三角形两腰 AE 与 AF
        gStep.appendChild(createSvgElement('line', {
          x1: A.x, y1: A.y, x2: E.x, y2: E.y,
          stroke: '#ea580c', 'stroke-width': '2'
        }));
        gStep.appendChild(createSvgElement('line', {
          x1: A.x, y1: A.y, x2: F.x, y2: F.y,
          stroke: '#ea580c', 'stroke-width': '2'
        }));
        tickMark2(A, E, '#ea580c', gStep);
        tickMark2(A, F, '#ea580c', gStep);

        // 射线 A-E'
        gStep.appendChild(createSvgElement('line', {
          x1: E.x, y1: E.y, x2: E_prime.x, y2: E_prime.y,
          stroke: '#059669', 'stroke-width': '1.8', 'stroke-dasharray': '4,4'
        }));

        // 两条关键平行线 EF 与 E'H 高亮
        gStep.appendChild(createSvgElement('line', {
          x1: E.x, y1: E.y, x2: F.x, y2: F.y,
          stroke: '#059669', 'stroke-width': '3'
        }));
        gStep.appendChild(createSvgElement('line', {
          x1: E_prime.x, y1: E_prime.y, x2: H.x, y2: H.y,
          stroke: '#059669', 'stroke-width': '3'
        }));

        // 平行箭头指示
        arrowMark(E, F, '#059669', gStep);
        arrowMark(E_prime, H, '#059669', gStep);

        // 角弧线 ∠AEF 与 ∠AE'H
        angleArc(E, A, F, 24, { stroke: '#dc2626' }, gStep);
        angleArc(E_prime, A, H, 24, { stroke: '#dc2626' }, gStep);

        // 垂心高线 CH
        gStep.appendChild(createSvgElement('line', {
          x1: C.x, y1: C.y, x2: H.x, y2: H.y,
          stroke: '#94a3b8', 'stroke-width': '1.5', 'stroke-dasharray': '3,3'
        }));
        angleArc(C, A, H, 20, { stroke: '#dc2626', 'stroke-dasharray': '2,2' }, gStep);

      } else if (idx === 3) {
        // Step 3: 平行同底等高面积变形 S(HEF) = S(EE'F)
        // 关键平行轨 EF 与 E'H
        gStep.appendChild(createSvgElement('line', {
          x1: E.x, y1: E.y, x2: F.x, y2: F.y,
          stroke: '#059669', 'stroke-width': '3.2'
        }));
        gStep.appendChild(createSvgElement('line', {
          x1: E_prime.x, y1: E_prime.y, x2: H.x, y2: H.y,
          stroke: '#059669', 'stroke-width': '2.2', 'stroke-dasharray': '4,4'
        }));
        arrowMark(E, F, '#059669', gStep);
        arrowMark(E_prime, H, '#059669', gStep);

        // △HEF (粉紫半透明)
        gStep.appendChild(createSvgElement('polygon', {
          points: `${H.x},${H.y} ${E.x},${E.y} ${F.x},${F.y}`,
          fill: '#8b5cf6', 'fill-opacity': '0.22',
          stroke: '#8b5cf6', 'stroke-width': '2'
        }));

        // △EE'F (翡翠绿半透明)
        gStep.appendChild(createSvgElement('polygon', {
          points: `${E_prime.x},${E_prime.y} ${E.x},${E.y} ${F.x},${F.y}`,
          fill: '#10b981', 'fill-opacity': '0.18',
          stroke: '#10b981', 'stroke-width': '2', 'stroke-dasharray': '5,3'
        }));

        // 连线 E'E
        gStep.appendChild(createSvgElement('line', {
          x1: A.x, y1: A.y, x2: E_prime.x, y2: E_prime.y,
          stroke: '#059669', 'stroke-width': '1.8'
        }));

      } else if (idx === 4) {
        // Step 4: 圆幂不变性 AE · EE' = I_P
        // 辅助圆 ⊙(AHC) 与 外接圆 ⊙O 对称对比
        gStep.appendChild(createSvgElement('circle', {
          cx: O.x, cy: O.y, r: O.r,
          fill: '#2563eb', 'fill-opacity': '0.03',
          stroke: '#2563eb', 'stroke-width': '1.8', 'stroke-dasharray': '5,4'
        }));
        gStep.appendChild(createSvgElement('circle', {
          cx: O_ahc.x, cy: O_ahc.y, r: O_ahc.r,
          fill: '#059669', 'fill-opacity': '0.03',
          stroke: '#059669', 'stroke-width': '1.8', 'stroke-dasharray': '5,4'
        }));

        // 连线 OP 标示点 P 的圆幂
        gStep.appendChild(createSvgElement('line', {
          x1: O.x, y1: O.y, x2: P.x, y2: P.y,
          stroke: '#ea580c', 'stroke-width': '2'
        }));

        // 射线 AE 与 EE' 分段高亮
        gStep.appendChild(createSvgElement('line', {
          x1: A.x, y1: A.y, x2: E.x, y2: E.y,
          stroke: '#2563eb', 'stroke-width': '3.5'
        }));
        gStep.appendChild(createSvgElement('line', {
          x1: E.x, y1: E.y, x2: E_prime.x, y2: E_prime.y,
          stroke: '#059669', 'stroke-width': '3.5'
        }));

        // △EE'F 轮廓
        gStep.appendChild(createSvgElement('polygon', {
          points: `${E_prime.x},${E_prime.y} ${E.x},${E.y} ${F.x},${F.y}`,
          fill: 'none', stroke: '#10b981', 'stroke-width': '1.8', 'stroke-dasharray': '4,3'
        }));

      } else if (idx === 5) {
        // Step 5: 三边对称轮换，展示 △HDE 与 △HDF 的面积
        gStep.appendChild(createSvgElement('polygon', {
          points: `${H.x},${H.y} ${D.x},${D.y} ${E.x},${E.y}`,
          fill: '#0284c7', 'fill-opacity': '0.24',
          stroke: '#0284c7', 'stroke-width': '2.5'
        }));
        gStep.appendChild(createSvgElement('polygon', {
          points: `${H.x},${H.y} ${D.x},${D.y} ${F.x},${F.y}`,
          fill: '#7c3aed', 'fill-opacity': '0.24',
          stroke: '#7c3aed', 'stroke-width': '2.5'
        }));

        // 连线 DE 与 DF
        gStep.appendChild(createSvgElement('line', {
          x1: D.x, y1: D.y, x2: E.x, y2: E.y,
          stroke: '#0284c7', 'stroke-width': '2'
        }));
        gStep.appendChild(createSvgElement('line', {
          x1: D.x, y1: D.y, x2: F.x, y2: F.y,
          stroke: '#7c3aed', 'stroke-width': '2'
        }));

      } else if (idx === 6) {
        // Step 6: 最终命题得证，全面展现 △HDE, △HDF 与 △OAB, △OAC 的面积等价对应
        // 外接圆 ⊙O
        gStep.appendChild(createSvgElement('circle', {
          cx: O.x, cy: O.y, r: O.r,
          fill: 'none', stroke: '#3b82f6', 'stroke-width': '2'
        }));

        // △OAB (天蓝填充，对应 ∠C = sin 2C)
        gStep.appendChild(createSvgElement('polygon', {
          points: `${O.x},${O.y} ${A.x},${A.y} ${B.x},${B.y}`,
          fill: '#0284c7', 'fill-opacity': '0.25',
          stroke: '#0284c7', 'stroke-width': '2'
        }));

        // △OAC (紫红填充，对应 ∠B = sin 2B)
        gStep.appendChild(createSvgElement('polygon', {
          points: `${O.x},${O.y} ${A.x},${A.y} ${C.x},${C.y}`,
          fill: '#7c3aed', 'fill-opacity': '0.25',
          stroke: '#7c3aed', 'stroke-width': '2'
        }));

        // △HDE (带外边框对比)
        gStep.appendChild(createSvgElement('polygon', {
          points: `${H.x},${H.y} ${D.x},${D.y} ${E.x},${E.y}`,
          fill: '#0284c7', 'fill-opacity': '0.15',
          stroke: '#0284c7', 'stroke-width': '2.5', 'stroke-dasharray': '5,3'
        }));

        // △HDF (带外边框对比)
        gStep.appendChild(createSvgElement('polygon', {
          points: `${H.x},${H.y} ${D.x},${D.y} ${F.x},${F.y}`,
          fill: '#7c3aed', 'fill-opacity': '0.15',
          stroke: '#7c3aed', 'stroke-width': '2.5', 'stroke-dasharray': '5,3'
        }));

        // 高亮外心半径 OA, OB, OC
        [A, B, C].forEach(pt => {
          gStep.appendChild(createSvgElement('line', {
            x1: O.x, y1: O.y, x2: pt.x, y2: pt.y,
            stroke: '#2563eb', 'stroke-width': '2'
          }));
        });
      }
    }

    // 初始化步骤列表
    function initSteps() {
      stepList.innerHTML = '';
      steps.forEach((s, i) => {
        const card = document.createElement('div');
        card.className = `step-card step-item ${i === currentStep ? 'active' : ''}`;
        card.innerHTML = `
          <div class="step-header title">
            <span><span class="step-badge badge">${i === 0 ? '✦' : i}</span>${s.title}</span>
            <span style="font-size:0.75rem; opacity:0.6;">#${i}</span>
          </div>
          <div class="step-body body">${s.body}</div>
        `;
        card.addEventListener('click', () => {
          stopAuto();
          goTo(i);
        });
        stepList.appendChild(card);
      });
    }

    // 全局统一跳转函数 goTo(idx)
    function goTo(idx) {
      if (idx < 0 || idx >= steps.length) return;
      currentStep = idx;

      // 更新列表激活状态
      document.querySelectorAll('.step-card').forEach((c, i) => {
        c.classList.toggle('active', i === currentStep);
      });

      // 自动平滑滚动
      const activeCard = document.querySelectorAll('.step-card')[currentStep];
      if (activeCard) {
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      // 渲染动态元素和顶层点标签
      renderStep(currentStep);
      renderPoints(currentStep);

      // 控制栏状态
      stepCounter.textContent = `第 ${currentStep} / ${steps.length - 1} 步`;
      btnPrev.disabled = currentStep === 0;
      btnNext.disabled = currentStep === steps.length - 1;

      // 双向同步 URL ?step=N
      const url = new URL(window.location);
      url.searchParams.set('step', currentStep);
      window.history.replaceState({}, '', url);
    
  if (typeof renderMath === 'function') {
    renderMath();
  }
  if (typeof renderMath === "function") renderMath();
}

    // 交互事件监听
    btnPrev.addEventListener('click', () => { stopAuto(); goTo(currentStep - 1); });
    btnNext.addEventListener('click', () => { stopAuto(); goTo(currentStep + 1); });
    btnReset.addEventListener('click', () => { stopAuto(); goTo(0);
if (typeof renderMath === 'function') renderMath(); });

    function stopAuto() {
      if (timer) {
        clearInterval(timer);
        timer = null;
        btnAuto.textContent = '▶ 自动';
      }
    }

    btnAuto.addEventListener('click', () => {
      if (timer) {
        stopAuto();
      } else {
        if (currentStep === steps.length - 1) goTo(0);
if (typeof renderMath === 'function') renderMath();
        btnAuto.textContent = '⏸ 暂停';
        timer = setInterval(() => {
          if (currentStep < steps.length - 1) {
            goTo(currentStep + 1);
          } else {
            stopAuto();
          }
        }, 2800);
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        stopAuto();
        goTo(currentStep + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        stopAuto();
        goTo(currentStep - 1);
      }
    });

    // 初始化渲染
    renderBase();
    initSteps();

    // 挂载初始步骤（支持 URL 参数读取）
    const urlParams = new URLSearchParams(window.location.search);
    const initialStep = parseInt(urlParams.get('step') || '0', 10);
    goTo(isNaN(initialStep) ? 0 : Math.max(0, Math.min(steps.length - 1, initialStep)));
  </script>

<!-- KaTeX 动态渲染与自适应触发脚本 -->
<script>
function renderMath(target) {
  if (typeof renderMathInElement === 'function') {
    const el = (target && target.nodeType) ? target : document.body;
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      macros: {
        '\parallel': '\mathbin{/\!/}',
        '\parallelogram': '\mathbin{/\!/}',
        '\bigtriangleup': '\triangle',
        '\triangle': '\triangle'
      },
      throwOnError: false,
      strict: false
    });
  }
}
window.renderMath = renderMath;
window.addEventListener('DOMContentLoaded', () => {
  renderMath();
  let mathTimer = null;
  const observer = new MutationObserver(() => {
    if (mathTimer) clearTimeout(mathTimer);
    mathTimer = setTimeout(() => renderMath(), 30);
  });
  observer.observe(document.body, { childList: true, subtree: true });
});
window.addEventListener('load', () => renderMath());
</script>
