<style>

<body>
<div class="container">
  <header>
    <h1>例 3 两圆相交与内心反演 (<span class="formula">SL = KL</span>) — 分步证明演示</h1>
    <p><b>已知</b>：两圆 <span class="formula">⊙O</span> 与 <span class="formula">⊙Γ</span> 交于 <span class="formula">A, B</span> 两点，<span class="formula">O ∈ ⊙Γ</span> 且在 <span class="formula">AB</span> 上的正交投影为 <span class="formula">S</span>，直线 <span class="formula">OS</span> 与 <span class="formula">⊙Γ</span> 交于点 <span class="formula">P</span>；<span class="formula">∠ASP</span> 平分线交 <span class="formula">⊙O</span> 于 <span class="formula">L</span>（<span class="formula">A, L</span> 在 <span class="formula">OP</span> 同侧）；点 <span class="formula">K ∈ ⊙Γ</span> 满足 <span class="formula">PS = PK</span>（<span class="formula">A, K</span> 在 <span class="formula">OP</span> 同侧）。<br><b>求证</b>：<span class="formula">SL = KL</span>。</p>
  </header>
  <div class="main">
    <div class="canvas-card">
      <svg id="stage" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="legend">
        <div class="legend-item"><span class="legend-line" style="background:#64748b;"></span>圆 Γ (灰)</div>
        <div class="legend-item"><span class="legend-line" style="background:#3b82f6;"></span>圆 O (主蓝)</div>
        <div class="legend-item"><span class="legend-line" style="background:#7c3aed; border:1px dashed #7c3aed;"></span>五点共圆 Γ' (紫虚)</div>
        <div class="legend-item"><span class="legend-line" style="background:#059669;"></span>角平分线 (绿)</div>
        <div class="legend-item"><span class="legend-line" style="background:#dc2626;"></span>目标结论/直角 (红)</div>
      </div>
    </div>
    <div class="panel">
      <div class="step-list" id="stepList"></div>
      <div class="controls">
        <button class="btn-ghost" id="btnPrev">◀ 上一步</button>
        <button class="btn-primary" id="btnNext">下一步 ▶</button>
        <button class="btn-ghost" id="btnAuto">▶ 自动</button>
        <button class="btn-ghost" id="btnReset">重置</button>
      </div>
      <div class="progress">快捷键：键盘 <kbd>←</kbd> <kbd>→</kbd> 切换步骤，URL 参数 <kbd>?step=N</kbd> 自动双向绑定</div>
    </div>
  </div>
</div>

<script>
/* ============ 几何计算与坐标映射 ============ */
const sub = (p,q) => ({x: p.x - q.x, y: p.y - q.y});
const add = (p,q) => ({x: p.x + q.x, y: p.y + q.y});
const mul = (p,k) => ({x: p.x * k, y: p.y * k});
const mid = (p,q) => ({x: (p.x + q.x)/2, y: (p.y + q.y)/2});
const len = p => Math.hypot(p.x, p.y);
const dist = (p,q) => len(sub(p,q));
const norm = p => { const l = len(p); return l === 0 ? {x:0, y:0} : {x:p.x/l, y:p.y/l}; };
const perp = d => ({x: -d.y, y: d.x});

/* 严格代数解析模型：
   圆 Gamma: 心 (0, 1), 半径 1, 直径 OP = 2, O=(0,0), P=(0,2)
   取 theta = 48°，消除视觉碰撞退化
*/
const theta = 48 * Math.PI / 180;
const yS_m = 2 * (1 - Math.cos(theta));
const PS_m = 2 - yS_m;
const RO_m = Math.sqrt(2 * yS_m);
const xA_m = Math.sqrt(2 * yS_m - yS_m * yS_m);
const xQ_m = PS_m * Math.tan(theta);
const K_m = { x: PS_m * Math.sin(theta), y: 2 - PS_m * Math.cos(theta) };
const r_in_m = (PS_m + xQ_m - 2) / 2;
const L_m = { x: r_in_m, y: yS_m + r_in_m };
const S_m = { x: 0, y: yS_m };
const P_m = { x: 0, y: 2 };
const O_m = { x: 0, y: 0 };
const A_m = { x: xA_m, y: yS_m };
const B_m = { x: -xA_m, y: yS_m };
const Q_m = { x: xQ_m, y: yS_m };
const gammaPrimeCenter_m = { x: xQ_m / 2, y: yS_m / 2 };
const gammaPrimeRadius_m = Math.hypot(xQ_m, yS_m) / 2;

/* 映射至 SVG 画布 (viewBox 0 0 680 620, scale = 165) */
const scale = 165.0;
const X0 = 306.49;
const Y0 = 380.09;
const toSvg = p => ({ x: +(X0 + scale * p.x).toFixed(2), y: +(Y0 - scale * p.y).toFixed(2) });

const P = toSvg(P_m);
const O = toSvg(O_m);
const S = toSvg(S_m);
const A = toSvg(A_m);
const B = toSvg(B_m);
const Q = toSvg(Q_m);
const K = toSvg(K_m);
const L = toSvg(L_m);
const centerGamma = toSvg({ x: 0, y: 1 });
const radiusGamma = scale * 1.0;
const radiusO = scale * RO_m;
const centerGammaPrime = toSvg(gammaPrimeCenter_m);
const radiusGammaPrime = scale * gammaPrimeRadius_m;

/* ============ SVG 绘图工具 ============ */
const NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById('stage');

function el(tag, attrs = {}, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function line(p, q, attrs = {}, parent){
  return el('line', { x1: p.x, y1: p.y, x2: q.x, y2: q.y, ...attrs }, parent);
}

function seg(p, q, color, w = 2, parent){
  return line(p, q, { stroke: color, 'stroke-width': w, fill: 'none' }, parent);
}

function segDashed(p, q, color, w = 2, parent, dash = '6 4'){
  return line(p, q, { stroke: color, 'stroke-width': w, 'stroke-dasharray': dash, fill: 'none' }, parent);
}

function circle(c, r, attrs = {}, parent){
  return el('circle', { cx: c.x, cy: c.y, r, fill: 'none', ...attrs }, parent);
}

function dot(p, color = '#1e293b', r = 4.5, parent){
  return el('circle', { cx: p.x, cy: p.y, r, fill: color, stroke: '#ffffff', 'stroke-width': 1.8 }, parent);
}

function polygon(pts, attrs = {}, parent){
  return el('polygon', { points: pts.map(p => `${p.x},${p.y}`).join(' '), ...attrs }, parent);
}

/* 顶层文字标签：带 4px 白色轮廓描边防遮挡 */
function label(p, text, dx = 0, dy = 0, color = '#0f172a', parent, size = 16){
  const t = el('text', {
    x: p.x + dx, y: p.y + dy,
    'font-size': size,
    fill: color,
    class: 'point-label'
  }, parent);
  t.textContent = text;
  return t;
}

/* 直角标记：顶点 v，两边分别指向 p1, p2 */
function rightAngleMark(v, p1, p2, s = 11, color = '#dc2626', parent){
  const u1 = norm(sub(p1, v)), u2 = norm(sub(p2, v));
  const a = add(v, mul(u1, s)), b = add(add(v, mul(u1, s)), mul(u2, s)), c = add(v, mul(u2, s));
  return el('polyline', {
    points: `${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y}`,
    fill: 'none', stroke: color, 'stroke-width': 1.8
  }, parent);
}

/* 等长刻度线：在 pq 中点处画横杠 */
function tickMark(p, q, color = '#2563eb', parent, count = 1){
  const m = mid(p, q), d = norm(sub(q, p)), n = perp(d);
  const lenMark = 6;
  if (count === 1) {
    line(add(m, mul(n, lenMark)), add(m, mul(n, -lenMark)), { stroke: color, 'stroke-width': 2.2 }, parent);
  } else if (count === 2) {
    const sep = 3;
    const m1 = add(m, mul(d, -sep)), m2 = add(m, mul(d, sep));
    line(add(m1, mul(n, lenMark)), add(m1, mul(n, -lenMark)), { stroke: color, 'stroke-width': 2 }, parent);
    line(add(m2, mul(n, lenMark)), add(m2, mul(n, -lenMark)), { stroke: color, 'stroke-width': 2 }, parent);
  }
}

/* 高亮线段（底层宽半透明 + 顶层亮线） */
function highlightSeg(p, q, color, parent, w = 3.5){
  line(p, q, { stroke: color, 'stroke-width': w + 5, 'stroke-linecap': 'round', opacity: 0.22 }, parent);
  line(p, q, { stroke: color, 'stroke-width': w, 'stroke-linecap': 'round' }, parent);
}

/* 绘制角弧线：顶点 v，两边分别指向 p1 和 p2 */
function angleArc(v, p1, p2, r = 18, color = '#dc2626', attrs = {}, parent){
  const a1 = Math.atan2(p1.y - v.y, p1.x - v.x);
  let a2 = Math.atan2(p2.y - v.y, p2.x - v.x);
  let da = a2 - a1;
  while (da < 0) da += Math.PI * 2;
  while (da >= Math.PI * 2) da -= Math.PI * 2;
  const sweep = da <= Math.PI ? 1 : 0;
  const s = { x: v.x + r * Math.cos(a1), y: v.y + r * Math.sin(a1) };
  const e = { x: v.x + r * Math.cos(a2), y: v.y + r * Math.sin(a2) };
  return el('path', {
    d: `M ${s.x} ${s.y} A ${r} ${r} 0 0 ${sweep} ${e.x} ${e.y}`,
    fill: 'none', stroke: color, 'stroke-width': 1.8, ...attrs
  }, parent);
}

/* ============ 分层架构 ============ */
const gBase = el('g', { id: 'gBase' }, stage);
const gStep = el('g', { id: 'gStep' }, stage);
const gPts  = el('g', { id: 'gPts' }, stage);

/* 颜色常量 */
const BLUE = '#2563eb', GREEN = '#059669', RED = '#dc2626',
      PURPLE = '#7c3aed', CYAN = '#0891b2', ORANGE = '#ea580c',
      GRAY = '#64748b', LIGHT_GRAY = '#cbd5e1';

/* 静态底层：全程保留的基础图元 */
function drawBase(){
  gBase.innerHTML = '';
  // 圆 Gamma (以 OP 为直径)
  circle(centerGamma, radiusGamma, { stroke: GRAY, 'stroke-width': 2, opacity: 0.8 }, gBase);
  // 圆 O (交 Gamma 于 A, B)
  circle(O, radiusO, { stroke: '#3b82f6', 'stroke-width': 2, opacity: 0.8 }, gBase);
  
  // 直径 OP 与 弦割线 AB
  seg(O, P, '#475569', 2, gBase);
  seg(B, A, '#475569', 2, gBase);

  // S 处垂足直角标记 (OS ⊥ AB)
  rightAngleMark(S, A, P, 11, '#64748b', gBase);
}

/* 顶层绘制点与文字标签 (防重叠白色轮廓描边) */
function drawPoints(showQ = false, isLPrime = false){
  gPts.innerHTML = '';
  dot(O, '#1e293b', 4.5, gPts); label(O, 'O', 0, 18, '#0f172a', gPts);
  dot(P, '#1e293b', 4.5, gPts); label(P, 'P', 0, -18, '#0f172a', gPts);
  dot(S, '#1e293b', 4.5, gPts); label(S, 'S', -16, 15, '#0f172a', gPts);
  dot(A, '#1e293b', 4.5, gPts); label(A, 'A', 14, 15, '#0f172a', gPts);
  dot(B, '#1e293b', 4.5, gPts); label(B, 'B', -16, 15, '#0f172a', gPts);
  dot(K, '#1e293b', 4.5, gPts); label(K, 'K', 16, -12, '#0f172a', gPts);

  const lLabel = isLPrime ? "L'" : "L";
  dot(L, '#2563eb', 5, gPts);
  label(L, lLabel, -15, -12, '#1e3a8a', gPts, 17);

  if (showQ) {
    dot(Q, '#7c3aed', 4.5, gPts);
    label(Q, 'Q', 18, 14, '#6b21a8', gPts);
  }
}

/* ============ 各步骤动态层 ============ */
function renderStep(s){
  gStep.innerHTML = ''; // 关键：每步先清空动态单步层，自然擦除旧辅助线
  
  switch(s){
    case 0: { // ✦ 已知条件与几何构型
      drawPoints(false, false);
      highlightSeg(P, S, BLUE, gStep, 3.5);
      highlightSeg(P, K, BLUE, gStep, 3.5);
      tickMark(P, S, BLUE, gStep, 1);
      tickMark(P, K, BLUE, gStep, 1);
      
      // 角平分线 SL 与 待证线段 SL, KL
      segDashed(S, L, GREEN, 2.2, gStep, '6 4');
      segDashed(S, L, RED, 2, gStep, '4 3');
      segDashed(K, L, RED, 2, gStep, '4 3');
      break;
    }

    case 1: { // ① 延长割线相交，得出四点共圆 Q, K, S, O
      drawPoints(true, false);
      segDashed(A, Q, CYAN, 2, gStep, '5 4');
      seg(P, Q, '#475569', 2, gStep);
      seg(O, K, BLUE, 2, gStep);
      segDashed(O, Q, PURPLE, 2, gStep, '6 4');

      rightAngleMark(K, O, P, 11, RED, gStep);
      rightAngleMark(S, Q, O, 11, RED, gStep);

      // 外接圆 Gamma' (四点共圆 Q, K, S, O，直径 OQ)
      circle(centerGammaPrime, radiusGammaPrime, {
        stroke: PURPLE, 'stroke-width': 2.2, 'stroke-dasharray': '7 5', opacity: 0.95
      }, gStep);
      break;
    }

    case 2: { // ② 直角三角比导出等腰对称 PO = PQ
      drawPoints(true, false);
      seg(P, Q, '#475569', 2, gStep);
      seg(A, Q, CYAN, 1.8, gStep);
      seg(O, K, BLUE, 1.8, gStep);
      
      // 填充直角三角形 PSQ 与直角三角形 PKO
      polygon([P, S, Q], { fill: '#3b82f6', opacity: 0.14 }, gStep);
      polygon([P, K, O], { fill: '#f59e0b', opacity: 0.16 }, gStep);
      
      rightAngleMark(S, Q, P, 11, RED, gStep);
      rightAngleMark(K, O, P, 11, RED, gStep);

      // 公共角 ∠QPO 弧
      angleArc(P, S, K, 24, ORANGE, {}, gStep);

      // 高亮等长边 PS = PK 与 PO = PQ
      highlightSeg(P, S, BLUE, gStep, 3);
      highlightSeg(P, K, BLUE, gStep, 3);
      tickMark(P, S, BLUE, gStep, 1);
      tickMark(P, K, BLUE, gStep, 1);

      highlightSeg(P, O, ORANGE, gStep, 3.5);
      highlightSeg(P, Q, ORANGE, gStep, 3.5);
      tickMark(P, O, ORANGE, gStep, 2);
      tickMark(P, Q, ORANGE, gStep, 2);
      break;
    }

    case 3: { // ③ 设内心 L'，证明 Q, K, L', S, O 五点共圆
      drawPoints(true, true);
      seg(P, Q, '#475569', 2, gStep);
      seg(A, Q, CYAN, 1.8, gStep);
      seg(O, Q, PURPLE, 2, gStep);

      // 外接圆 Gamma'
      circle(centerGammaPrime, radiusGammaPrime, {
        stroke: PURPLE, 'stroke-width': 2.2, 'stroke-dasharray': '7 5', opacity: 0.95
      }, gStep);

      // 内心连线 QL', SL', PL'
      segDashed(Q, L, PURPLE, 2, gStep, '5 4');
      segDashed(S, L, GREEN, 2, gStep, '5 4');
      segDashed(P, L, GREEN, 2, gStep, '5 4');

      // 互补角弧: ∠QL'S 与 ∠QOS
      angleArc(L, Q, S, 18, RED, {}, gStep);
      angleArc(O, S, Q, 22, RED, {}, gStep);
      break;
    }

    case 4: { // ④ 导角证明相似三角形 △QL'K ~ △QPL'
      drawPoints(true, true);
      seg(P, Q, '#475569', 2, gStep);
      seg(A, Q, CYAN, 1.8, gStep);

      circle(centerGammaPrime, radiusGammaPrime, {
        stroke: PURPLE, 'stroke-width': 1.6, 'stroke-dasharray': '6 5', opacity: 0.6
      }, gStep);

      // 相似三角形高亮填充
      polygon([Q, L, K], { fill: '#8b5cf6', opacity: 0.22, stroke: '#7c3aed', 'stroke-width': 1.5 }, gStep);
      polygon([Q, P, L], { fill: '#06b6d4', opacity: 0.16, stroke: '#0891b2', 'stroke-width': 1.5 }, gStep);

      seg(L, K, PURPLE, 2, gStep);
      seg(L, P, CYAN, 2, gStep);
      seg(Q, L, PURPLE, 2.2, gStep);

      // 等角弧 ∠QL'K 与 ∠QPL'
      angleArc(L, Q, K, 20, ORANGE, {}, gStep);
      angleArc(P, Q, L, 24, ORANGE, {}, gStep);
      angleArc(Q, K, L, 20, GREEN, {}, gStep);
      break;
    }

    case 5: { // ⑤ 结合根轴圆幂与勾股定理，证明 L 与 L' 重合
      drawPoints(true, true);
      seg(P, Q, '#475569', 2, gStep);
      seg(A, Q, CYAN, 2, gStep);
      seg(O, Q, PURPLE, 2, gStep);

      // 直角三角形 QL'O (直径 OQ 对应直角 ∠QL'O = 90°)
      polygon([Q, L, O], { fill: '#3b82f6', opacity: 0.14 }, gStep);
      seg(Q, L, PURPLE, 2, gStep);
      seg(O, L, BLUE, 2.5, gStep);
      rightAngleMark(L, Q, O, 11, RED, gStep);

      // 圆 O 半径 OA 与 OL' 等长高亮
      highlightSeg(O, A, BLUE, gStep, 3);
      highlightSeg(O, L, BLUE, gStep, 3);
      tickMark(O, A, BLUE, gStep, 2);
      tickMark(O, L, BLUE, gStep, 2);

      // 割线与根轴高亮
      highlightSeg(B, Q, CYAN, gStep, 2.5);
      highlightSeg(P, Q, GRAY, gStep, 2.5);
      break;
    }

    case 6: { // ⑥ 等腰三角形顶角平分线即中垂线，证得 SL = KL
      drawPoints(true, false);
      seg(P, Q, LIGHT_GRAY, 1.5, gStep);
      seg(A, Q, LIGHT_GRAY, 1.5, gStep);

      // 等腰三角形 △PSK 底边 SK
      seg(S, K, '#64748b', 2.2, gStep);
      
      const midSK = mid(S, K);
      seg(P, L, GREEN, 2.5, gStep);
      segDashed(L, midSK, GREEN, 2, gStep, '4 3');

      // 垂足直角标记 (PL ⊥ SK)
      rightAngleMark(midSK, S, P, 10, RED, gStep);
      tickMark(S, midSK, GREEN, gStep, 1);
      tickMark(K, midSK, GREEN, gStep, 1);

      // 最终核心结论：高亮 SL 与 KL，并加双刻度标记
      highlightSeg(S, L, RED, gStep, 4);
      highlightSeg(K, L, RED, gStep, 4);
      tickMark(S, L, RED, gStep, 2);
      tickMark(K, L, RED, gStep, 2);

      // 结论成就标语
      const badgeG = el('g', { transform: 'translate(450, 480)' }, gStep);
      el('rect', {
        x: 0, y: 0, width: 190, height: 42, rx: 10,
        fill: '#f0fdf4', stroke: '#16a34a', 'stroke-width': 1.5,
        filter: 'drop-shadow(0 4px 12px rgba(22,163,74,0.15))'
      }, badgeG);
      const txt = el('text', {
        x: 95, y: 22, 'font-size': 14, fill: '#15803d', 'font-weight': '700',
        'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-family': '-apple-system, BlinkMacSystemFont, sans-serif'
      }, badgeG);
      txt.textContent = '★ 结论证毕: SL = KL';
      break;
    }
  }
}

/* ============ 步骤文本配置 ============ */
const steps = [
  {
    title: '已知条件与几何构型',
    body: `已知两圆 <span class="formula">⊙O</span> 与 <span class="formula">⊙Γ</span> 相交于 <span class="formula">A, B</span> 两点，点 <span class="formula">O ∈ ⊙Γ</span> 且在弦 <span class="formula">AB</span> 上的垂足投影为 <span class="formula">S</span>。<br>直线 <span class="formula">OS</span> 与 <span class="formula">⊙Γ</span> 交于点 <span class="formula">P</span>，因此线段 <span class="formula">OP</span> 恰为 <span class="formula">⊙Γ</span> 的一条直径。<br><span class="formula">∠ASP</span> 的平分线与 <span class="formula">⊙O</span> 交于点 <span class="formula">L</span>（<span class="formula">A, L</span> 在 <span class="formula">OP</span> 同侧）。<br>点 <span class="formula">K ∈ ⊙Γ</span> 满足 <span class="formula">PS = PK</span>（<span class="formula">A, K</span> 在 <span class="formula">OP</span> 同侧）。<br><b>求证</b>：<span style="color:#dc2626; font-weight:700;">SL = KL</span>。`
  },
  {
    title: '① 延长割线相交，得出四点共圆 Q, K, S, O',

  },
  {
    title: '② 利用直角三角比，导出等腰对称 PO = PQ',
    body: `在直角 <span class="formula">△PSQ</span> 中（<span class="formula">∠PSQ = 90°</span>），由三角比：<br>$$\\cos\\angle QPO = \\frac{PS}{PQ}$$<br>在直角 <span class="formula">△PKO</span> 中（<span class="formula">∠PKO = 90°</span>），同理有：<br>$$\\cos\\angle QPO = \\frac{PK}{PO}$$<br>已知条件给定 <span class="formula">PS = PK</span>，分子相等则分母必相等：<b><span style="color:#ea580c; font-weight:700;">PO = PQ</span></b>！<br>这表明 <span class="formula">△PQO</span> 是以 <span class="formula">P</span> 为顶点的等腰三角形，两高线 <span class="formula">QS</span> 与 <span class="formula">OK</span> 呈对称结构。`

  {

    body: `设直角 <span class="formula">△QSP</span> 的内心为 <span class="formula">L'</span>。由内心经典角平分性质：<br>$$\\angle QL'S = 90° + \\frac{1}{2}\\angle QPS = 90° + \\frac{1}{2}\\angle QPO$$<br>又在等腰 <span class="formula">△PQO</span> 中，底角 <span class="formula">\\angle QOP = 90° - \\frac{1}{2}\\angle QPO</span>，从而：<br>$$\\angle QL'S = 180° - \\angle QOP = 180° - \\angle QOS$$<br>因此四边形 <span class="formula">QL'SO</span> 对角互补，点 <span class="formula">L'</span> 必在过 <span class="formula">Q, S, O</span> 的外接圆上。<br>综合前述，<b><span class="formula">Q, K, L', S, O</span> 五点共圆于 <span class="formula">Γ'</span></b>，且 <span class="formula">OQ</span> 为其直径。`

];

/* ============ 交互与双向路由控制 ============ */
let cur = 0, timer = null;
const listEl = document.getElementById('stepList');

steps.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'step-item';
  d.innerHTML = `<div class="title"><span class="badge">${i === 0 ? '✦' : i}</span>${s.title}</div>
                 <div class="body">${s.body}</div>`;
  d.onclick = () => { stopAuto(); goTo(i); };
  listEl.appendChild(d);
});

const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnAuto = document.getElementById('btnAuto');

function goTo(i){
  cur = Math.max(0, Math.min(steps.length - 1, i));
  [...listEl.children].forEach((d, k) => {
    d.classList.toggle('active', k === cur);
    d.classList.toggle('done', k < cur);
  });
  renderStep(cur);
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;
  if (listEl.children[cur]) {
    listEl.children[cur].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // URL ?step=N 参数双向同步绑定
  const url = new URL(window.location.href);
  if (url.searchParams.get('step') !== String(cur)) {
    url.searchParams.set('step', cur);
    window.history.replaceState({ step: cur }, '', url.toString());
  }

  if (typeof renderMath === 'function') {
    renderMath();
  }
  if (typeof renderMath === "function") renderMath();
}

btnPrev.onclick = () => { stopAuto(); goTo(cur - 1); };
btnNext.onclick = () => { stopAuto(); goTo(cur + 1); };
document.getElementById('btnReset').onclick = () => { stopAuto(); goTo(0);
if (typeof renderMath === 'function') renderMath(); };

function stopAuto(){
  if (timer){ clearInterval(timer); timer = null; btnAuto.textContent = '▶ 自动'; }
}

btnAuto.onclick = () => {
  if (timer){ stopAuto(); return; }
  btnAuto.textContent = '⏸ 暂停';
  if (cur >= steps.length - 1) goTo(0);
if (typeof renderMath === 'function') renderMath();
  timer = setInterval(() => {
    if (cur >= steps.length - 1){ stopAuto(); return; }
    goTo(cur + 1);
  }, 2800);
};

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'){ stopAuto(); goTo(cur - 1); }
  if (e.key === 'ArrowRight'){ stopAuto(); goTo(cur + 1); }
});

window.addEventListener('popstate', (e) => {
  const step = e.state && e.state.step !== undefined ? e.state.step : (parseInt(new URLSearchParams(location.search).get('step')) || 0);
  goTo(step);
});

// 初始化
drawBase();
const initStep = parseInt(new URLSearchParams(location.search).get('step')) || 0;
goTo(initStep);
if (typeof renderMath === 'function') renderMath();
</script>

<!-- KaTeX 动态渲染与自适应触发脚本 -->
<script>
function renderMath(target) {
  if (typeof renderMathInElement === 'function') {
    const el = (target && target.nodeType) ? target : document.body;
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      macros: {
        '\parallel': '\mathbin{/\!/}',
        '\parallelogram': '\mathbin{/\!/}',
        '\bigtriangleup': '\triangle',
        '\triangle': '\triangle'
      },
      throwOnError: false,
      strict: false
    });
  }
}
window.renderMath = renderMath;
window.addEventListener('DOMContentLoaded', () => {
  renderMath();
  let mathTimer = null;
  const observer = new MutationObserver(() => {
    if (mathTimer) clearTimeout(mathTimer);
    mathTimer = setTimeout(() => renderMath(), 30);
  });
  observer.observe(document.body, { childList: true, subtree: true });
});
window.addEventListener('load', () => renderMath());
</script>
