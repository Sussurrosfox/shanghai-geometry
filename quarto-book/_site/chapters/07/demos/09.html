<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对角线外接圆交点与根轴共线证明 — 分步演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: linear-gradient(135deg, #eef2f7 0%, #f8fafc 100%);
    min-height: 100vh;
    color: #1e293b;
    padding: 24px 16px;
  }
  .container { max-width: 1240px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 24px; font-weight: 700; color: #0f172a; letter-spacing: -0.5px; }
  header p { font-size: 14px; color: #64748b; margin-top: 6px; line-height: 1.5; }
  .main { display: flex; gap: 20px; align-items: stretch; flex-wrap: wrap; }
  .canvas-card {
    flex: 1 1 580px; background: #fff; border-radius: 16px;
    box-shadow: 0 4px 24px rgba(15,23,42,.08); padding: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  svg { width: 100%; height: auto; max-height: 76vh; overflow: visible; }
  /* 顶层文字带 4px 白色轮廓描边，彻底防止文字与几何线段冲突碰撞 */
  text {
    paint-order: stroke fill;
    stroke: #ffffff;
    stroke-width: 4px;
    stroke-linejoin: round;
    user-select: none;
  }
  .panel {
    flex: 1 1 380px; background: #fff; border-radius: 16px;
    box-shadow: 0 4px 24px rgba(15,23,42,.08); padding: 20px;
    display: flex; flex-direction: column;
  }
  .step-list { flex: 1; overflow-y: auto; margin-bottom: 14px; max-height: 62vh; padding-right: 4px; }
  .step-item {
    border: 1px solid #e2e8f0; border-radius: 12px; padding: 11px 14px;
    margin-bottom: 8px; cursor: pointer; transition: all .2s;
  }
  .step-item .title { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; color: #1e293b; }
  .step-item .badge {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    background: #e2e8f0; color: #475569; font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center; font-weight: 700;
  }
  .step-item .body { font-size: 13.5px; line-height: 1.8; color: #334155; margin-top: 8px; display: none; }
  .step-item.active { border-color: #2563eb; background: #eff6ff; }
  .step-item.active .badge { background: #2563eb; color: #fff; }
  .step-item.active .body { display: block; }
  .step-item.done .badge { background: #93c5fd; color: #fff; }
  .controls { display: flex; gap: 8px; align-items: center; }
  button {
    border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px;
    cursor: pointer; font-weight: 600; transition: all .15s; font-family: inherit;
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: #2563eb; color: #fff; flex: 1; }
  .btn-primary:not(:disabled):hover { background: #1d4ed8; }
  .btn-ghost { background: #f1f5f9; color: #334155; }
  .btn-ghost:not(:disabled):hover { background: #e2e8f0; }
  .progress { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 10px; }
  kbd { background:#f1f5f9; border:1px solid #cbd5e1; border-radius:4px; padding:0 5px; font-size:12px; }
  .math { font-family: "Times New Roman", "STIX Two Math", serif; font-style: italic; }
  .tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-right: 4px; }
</style>
  <!-- KaTeX 数学公式渲染引擎 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<div class="container">
  <header>
    <h1>对角线外接圆交点与两圆根轴共线证明</h1>
    <p><b>已知</b>：锐角 $\triangle APD$ 的边 $AP, PD$ 上各取点 $B, C$，对角线 $AC \cap BD = Q$；$\triangle APD, \triangle BPC$ 垂心为 $H_1, H_2$；直线 $H_1H_2$ 过 $\triangle ABQ, \triangle CDQ$ 外接圆交点 $X$。&nbsp;&nbsp;<b>求证</b>：直线 $H_1H_2$ 必过 $\triangle BQC, \triangle AQD$ 外接圆交点 $Y$。</p>
  </header>
  <div class="main">
    <div class="canvas-card">
      <svg id="stage" viewBox="50 40 620 560" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="panel">
      <div class="step-list" id="stepList"></div>
      <div class="controls">
        <button class="btn-ghost" id="btnPrev">◀ 上一步</button>
        <button class="btn-primary" id="btnNext">下一步 ▶</button>
        <button class="btn-ghost" id="btnAuto">▶ 自动</button>
        <button class="btn-ghost" id="btnReset">重置</button>
      </div>
      <div class="progress">快捷键：键盘 <kbd>←</kbd> <kbd>→</kbd> 切换步骤</div>
    </div>
  </div>
</div>

<script>
/* ============ 几何计算与精确求解 ============ */
const sub = (p,q) => ({x:p.x-q.x, y:p.y-q.y});
const add = (p,q) => ({x:p.x+q.x, y:p.y+q.y});
const mul = (p,k) => ({x:p.x*k, y:p.y*k});
const mid = (p,q) => ({x:(p.x+q.x)/2, y:(p.y+q.y)/2});
const len = p => Math.hypot(p.x, p.y);
const dist = (p,q) => len(sub(p,q));
const norm = p => { const l = len(p); return l === 0 ? {x:0, y:0} : {x:p.x/l, y:p.y/l}; };
const perp = d => ({x:-d.y, y:d.x});
const dotProd = (p,q) => p.x*q.x + p.y*q.y;

function lineIntersect(p1, d1, p2, d2){
  const det = d1.x*(-d2.y) - (-d2.x)*d1.y;
  if (Math.abs(det) < 1e-9) return null;
  const t = ((p2.x-p1.x)*(-d2.y) - (-d2.x)*(p2.y-p1.y)) / det;
  return add(p1, mul(d1, t));
}
function foot(P, P1, P2){   // P 到直线 P1P2 的垂足
  const d = sub(P2,P1);
  const denom = d.x*d.x + d.y*d.y;
  if (denom < 1e-9) return P1;
  const t = ((P.x-P1.x)*d.x + (P.y-P1.y)*d.y) / denom;
  return add(P1, mul(d, t));
}
function orthocenter(A, B, C){
  const fA = foot(A, B, C);
  const fB = foot(B, A, C);
  return lineIntersect(A, sub(fA, A), B, sub(fB, B));
}
function circumcircle(A, B, C){
  const mAB = mid(A, B), dAB = perp(sub(B, A));
  const mAC = mid(A, C), dAC = perp(sub(C, A));
  const center = lineIntersect(mAB, dAB, mAC, dAC);
  const r = dist(center, A);
  return { center, r };
}
function circleIntersect(C1, r1, C2, r2){
  const d = dist(C1, C2);
  if (d < 1e-9 || d > r1 + r2 || d < Math.abs(r1 - r2)) return null;
  const a = (d*d - r2*r2 + r1*r1) / (2 * d);
  const h = Math.sqrt(Math.max(0, r1*r1 - a*a));
  const u = norm(sub(C2, C1));
  const v = perp(u);
  const pBase = add(C1, mul(u, a));
  return [add(pBase, mul(v, h)), add(pBase, mul(v, -h))];
}
function otherIntersection(C1, r1, C2, r2, Q){
  const pts = circleIntersect(C1, r1, C2, r2);
  if (!pts) return null;
  return dist(pts[0], Q) > dist(pts[1], Q) ? pts[0] : pts[1];
}

/* 严格设定几何基准点，满足锐角三角形与 AC = BD */
const P = {x: 360.0, y: 90.0};
const A = {x: 180.0, y: 460.0};
const D = {x: 580.0, y: 460.0};
const B = {x: 234.0, y: 349.0}; // 在线段 PA 上 (u = 0.575)

// 严格求解射线 PD 上的 C，使得 AC = BD
const distBD = dist(B, D);
const W = sub(P, A);
const V = sub(D, P);
const qa = dotProd(V, V);
const qb = 2 * dotProd(W, V);
const qc = dotProd(W, W) - distBD * distBD;
const disc = qb * qb - 4 * qa * qc;
const vVal = (-qb + Math.sqrt(Math.max(0, disc))) / (2 * qa);
const C = add(P, mul(V, vVal)); // (415.42, 183.21)

// 对角线交点 Q
const Q = lineIntersect(A, sub(C, A), B, sub(D, B));

// 中点 M, N
const M = mid(A, C);
const N = mid(B, D);
const r1 = dist(A, C) / 2;
const r2 = dist(B, D) / 2;

// 垂心 H1, H2
const H1 = orthocenter(A, P, D);
const H2 = orthocenter(B, P, C);

// 高线垂足
const A1 = foot(A, P, D);
const D1 = foot(D, P, A);
const B1 = foot(B, P, D);
const C1 = foot(C, P, A);

// 外接圆求解
const cirABQ = circumcircle(A, B, Q);
const cirCDQ = circumcircle(C, D, Q);
const X = otherIntersection(cirABQ.center, cirABQ.r, cirCDQ.center, cirCDQ.r, Q);

const cirBQC = circumcircle(B, Q, C);
const cirAQD = circumcircle(A, Q, D);
const Y = otherIntersection(cirBQC.center, cirBQC.r, cirAQD.center, cirAQD.r, Q);

/* ============ SVG 绘图工具 ============ */
const NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById('stage');
function el(tag, attrs = {}, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function line(p, q, attrs, parent){
  return el('line', {x1:p.x, y1:p.y, x2:q.x, y2:q.y, ...attrs}, parent);
}
function segDashed(p, q, color, w=1.8, parent){
  return line(p, q, {stroke:color, 'stroke-width':w, 'stroke-dasharray':'6 4', fill:'none'}, parent);
}
function circle(c, r, attrs = {}, parent){
  return el('circle', {cx:c.x, cy:c.y, r, fill:'none', ...attrs}, parent);
}
function dot(p, color, r=4.5, parent){
  return el('circle', {cx:p.x, cy:p.y, r, fill:color, stroke:'#fff', 'stroke-width':1.8}, parent);
}
function glowDot(p, color, r=5, parent){
  el('circle', {cx:p.x, cy:p.y, r: r+6, fill:color, opacity: 0.25}, parent);
  return el('circle', {cx:p.x, cy:p.y, r, fill:color, stroke:'#fff', 'stroke-width':2}, parent);
}
function polygon(pts, attrs = {}, parent){
  return el('polygon', {points: pts.map(p=>`${p.x},${p.y}`).join(' '), ...attrs}, parent);
}
function label(p, text, dx=0, dy=0, color='#0f172a', parent, size=16, bold=true){
  const t = el('text', {
    x: p.x + dx, y: p.y + dy, 'font-size': size, fill: color,
    'text-anchor': 'middle', 'dominant-baseline': 'central',
    'font-family': '"Times New Roman", "STIX Two Math", serif', 'font-style': 'italic',
    'font-weight': bold ? '700' : '500'
  }, parent);
  t.textContent = text;
  return t;
}
function rightAngleMark(v, p1, p2, s=12, color='#ea580c', parent){
  const u1 = norm(sub(p1,v)), u2 = norm(sub(p2,v));
  const a = add(v, mul(u1,s)), b = add(add(v, mul(u1,s)), mul(u2,s)), c = add(v, mul(u2,s));
  return el('polyline', {points:`${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y}`,
    fill:'none', stroke:color, 'stroke-width':1.8}, parent);
}
function tickMark(p, q, color, parent, offset=0){
  const m = mid(p,q), d = norm(sub(q,p)), n = perp(d);
  const c = add(m, mul(d, offset));
  line(add(c, mul(n,5.5)), add(c, mul(n,-5.5)), {stroke:color, 'stroke-width':2.2}, parent);
}
function highlightSeg(p, q, color, parent, w=4){
  line(p, q, {stroke:color, 'stroke-width':w+5, 'stroke-linecap':'round', opacity:.2}, parent);
  line(p, q, {stroke:color, 'stroke-width':w, 'stroke-linecap':'round'}, parent);
}
function extendedLine(p, q, ext1=30, ext2=30, attrs={}, parent){
  const d = norm(sub(q,p));
  return line(sub(p, mul(d, ext1)), add(q, mul(d, ext2)), attrs, parent);
}

/* ============ 分层渲染架构 ============ */
const gBase = el('g', {id: 'gBase'}, stage);      // 底层：原始骨架
const gStep = el('g', {id: 'gStep'}, stage);      // 动态步骤层（切换步骤时先清空）
const gPts  = el('g', {id: 'gPts'}, stage);       // 顶层：点与文字标签

/* 全局固定色彩常量 */
const BLUE   = '#2563eb', // 主蓝 (圆 ABQ, 点 X 标记)
      GREEN  = '#059669', // 翡翠绿 (圆 omega2, 点 Y 标记)
      RED    = '#dc2626', // 深红/根轴 (根轴 H1H2, 关键高亮)
      PURPLE = '#7c3aed', // 靛紫 (圆 omega1)
      CYAN   = '#0891b2', // 青色 (圆 CDQ)
      ORANGE = '#ea580c', // 橙红 (高线及垂足)
      AMBER  = '#d97706', // 琥珀黄 (圆 BQC)
      VIOLET = '#8b5cf6'; // 紫罗兰 (圆 AQD)

function drawBase(){
  gBase.innerHTML = '';
  // 锐角三角形 APD
  line(P, A, {stroke: '#475569', 'stroke-width': 2}, gBase);
  line(P, D, {stroke: '#475569', 'stroke-width': 2}, gBase);
  line(A, D, {stroke: '#475569', 'stroke-width': 2}, gBase);
  // 四边形边 BC
  line(B, C, {stroke: '#64748b', 'stroke-width': 1.8}, gBase);
  // 对角线 AC 与 BD
  line(A, C, {stroke: '#94a3b8', 'stroke-width': 1.5, 'stroke-dasharray': '4 3'}, gBase);
  line(B, D, {stroke: '#94a3b8', 'stroke-width': 1.5, 'stroke-dasharray': '4 3'}, gBase);
}

/* 绘制顶层点与文字（根据步骤按需展示） */
function drawPoints(step){
  gPts.innerHTML = '';
  
  // 基础点恒定显示
  dot(P, '#0f172a', 4.5, gPts); label(P, 'P', 0, -16, '#0f172a', gPts);
  dot(A, '#0f172a', 4.5, gPts); label(A, 'A', -16, 16, '#0f172a', gPts);
  dot(D, '#0f172a', 4.5, gPts); label(D, 'D', 16, 16, '#0f172a', gPts);
  dot(B, '#0f172a', 4.5, gPts); label(B, 'B', -18, -4, '#0f172a', gPts);
  dot(C, '#0f172a', 4.5, gPts); label(C, 'C', 18, -6, '#0f172a', gPts);
  dot(Q, '#475569', 4, gPts);   label(Q, 'Q', 14, 14, '#475569', gPts);

  // 中点 M, N 在步骤 1, 2, 3, 4, 5, 6 显示
  if (step >= 1) {
    dot(M, PURPLE, 4, gPts); label(M, 'M', -16, -12, PURPLE, gPts);
    dot(N, GREEN, 4, gPts);  label(N, 'N', 16, 12, GREEN, gPts);
  }

  // 垂足点在步骤 1, 2 显示
  if (step === 1 || step === 2) {
    dot(A1, ORANGE, 3.5, gPts); label(A1, 'A₁', 18, 4, ORANGE, gPts, 14);
    dot(D1, ORANGE, 3.5, gPts); label(D1, 'D₁', -18, 12, ORANGE, gPts, 14);
    dot(B1, ORANGE, 3.5, gPts); label(B1, 'B₁', 16, 14, ORANGE, gPts, 14);
    dot(C1, ORANGE, 3.5, gPts); label(C1, 'C₁', -18, -8, ORANGE, gPts, 14);
  }

  // 垂心 H1, H2 在步骤 0（预览）、步骤 2、步骤 3、步骤 6 中显示
  if (step === 0 || step >= 2) {
    dot(H1, RED, 4.5, gPts); label(H1, 'H₁', 18, 12, RED, gPts);
    dot(H2, RED, 4.5, gPts); label(H2, 'H₂', 20, -4, RED, gPts);
  }

  // 点 X 在步骤 0（预览）、步骤 3、步骤 4、步骤 6 中高亮显示
  if (step === 0 || step === 3 || step === 4 || step === 6) {
    glowDot(X, '#e11d48', 5, gPts);
    label(X, 'X', -18, 16, '#e11d48', gPts, 17, true);
  }

  // 点 Y 在步骤 0（预览）、步骤 5、步骤 6 中高亮显示
  if (step === 0 || step === 5 || step === 6) {
    glowDot(Y, '#10b981', 5, gPts);
    label(Y, 'Y', -18, -14, '#059669', gPts, 17, true);
  }
}

/* ============ 各步骤动态图元渲染 ============ */
function renderStep(s){
  gStep.innerHTML = ''; // 切换时立刻清空，彻底擦除上一阶段图元
  drawPoints(s);

  switch(s){
    case 0: {
      // 步骤 0：已知条件总览，淡淡勾勒目标根轴与两交点
      extendedLine(H1, H2, 140, 60, {stroke: '#cbd5e1', 'stroke-width': 1.8, 'stroke-dasharray':'5 4'}, gStep);
      break;
    }
    case 1: {
      // 步骤 1：直径圆 omega1, omega2 与四条高线及垂足
      // 直径圆 omega1 (以 AC 为直径)
      circle(M, r1, {stroke: PURPLE, 'stroke-width': 1.6, 'stroke-dasharray': '5 4', opacity: 0.75}, gStep);
      // 直径圆 omega2 (以 BD 为直径)
      circle(N, r2, {stroke: GREEN, 'stroke-width': 1.6, 'stroke-dasharray': '5 4', opacity: 0.75}, gStep);

      // 高线 AA1, DD1, BB1, CC1
      line(A, A1, {stroke: ORANGE, 'stroke-width': 1.6, 'stroke-dasharray': '4 3'}, gStep);
      line(D, D1, {stroke: ORANGE, 'stroke-width': 1.6, 'stroke-dasharray': '4 3'}, gStep);
      line(B, B1, {stroke: ORANGE, 'stroke-width': 1.6, 'stroke-dasharray': '4 3'}, gStep);
      line(C, C1, {stroke: ORANGE, 'stroke-width': 1.6, 'stroke-dasharray': '4 3'}, gStep);

      // 直角标记
      rightAngleMark(A1, A, P, 11, ORANGE, gStep);
      rightAngleMark(D1, D, P, 11, ORANGE, gStep);
      rightAngleMark(B1, B, P, 11, ORANGE, gStep);
      rightAngleMark(C1, C, P, 11, ORANGE, gStep);
      break;
    }
    case 2: {
      // 步骤 2：垂心幂次定理，确立 H1H2 为根轴
      // 背景直径圆
      circle(M, r1, {stroke: PURPLE, 'stroke-width': 1.4, 'stroke-dasharray': '5 4', opacity: 0.5}, gStep);
      circle(N, r2, {stroke: GREEN, 'stroke-width': 1.4, 'stroke-dasharray': '5 4', opacity: 0.5}, gStep);

      // 连结圆心线 MN
      line(M, N, {stroke: '#94a3b8', 'stroke-width': 1.5, 'stroke-dasharray': '4 3'}, gStep);

      // 垂心高线切割段高亮
      highlightSeg(H1, A, ORANGE, gStep, 3);
      highlightSeg(H1, A1, ORANGE, gStep, 3);
      highlightSeg(H1, D, ORANGE, gStep, 3);
      highlightSeg(H1, D1, ORANGE, gStep, 3);

      // 绘制根轴 H1H2
      extendedLine(H1, H2, 140, 60, {stroke: RED, 'stroke-width': 2.4}, gStep);
      break;
    }
    case 3: {
      // 步骤 3：外接圆 ABQ 与 CDQ 交于 X，导出圆幂等式
      // 直径圆底衬
      circle(M, r1, {stroke: PURPLE, 'stroke-width': 1.2, 'stroke-dasharray': '5 4', opacity: 0.35}, gStep);
      circle(N, r2, {stroke: GREEN, 'stroke-width': 1.2, 'stroke-dasharray': '5 4', opacity: 0.35}, gStep);

      // 外接圆 ABQ
      circle(cirABQ.center, cirABQ.r, {stroke: BLUE, 'stroke-width': 1.8, 'stroke-dasharray': '6 4'}, gStep);
      // 外接圆 CDQ
      circle(cirCDQ.center, cirCDQ.r, {stroke: CYAN, 'stroke-width': 1.8, 'stroke-dasharray': '6 4'}, gStep);

      // 根轴 H1H2
      extendedLine(H1, H2, 140, 60, {stroke: RED, 'stroke-width': 2.2}, gStep);

      // 连结 XM 与 XN 展示圆幂距离
      segDashed(X, M, PURPLE, 1.8, gStep);
      segDashed(X, N, GREEN, 1.8, gStep);
      break;
    }
    case 4: {
      // 步骤 4：螺旋相似 △XAC ~ △XBD 导出 AC = BD
      // 绘制三角形 XAC 与 XBD 的半透明填充
      polygon([X, A, C], {fill: BLUE, opacity: 0.12}, gStep);
      polygon([X, B, D], {fill: CYAN, opacity: 0.12}, gStep);

      // 相似三角形边界高亮
      highlightSeg(X, A, BLUE, gStep, 2.5);
      highlightSeg(X, C, BLUE, gStep, 2.5);
      highlightSeg(X, B, CYAN, gStep, 2.5);
      highlightSeg(X, D, CYAN, gStep, 2.5);

      // 对应中线高亮
      segDashed(X, M, PURPLE, 2, gStep);
      segDashed(X, N, GREEN, 2, gStep);

      // 对应底边 AC 与 BD 等长刻度标记
      highlightSeg(A, C, BLUE, gStep, 3);
      highlightSeg(B, D, CYAN, gStep, 3);
      tickMark(A, C, BLUE, gStep, -4);
      tickMark(A, C, BLUE, gStep, 4);
      tickMark(B, D, CYAN, gStep, -4);
      tickMark(B, D, CYAN, gStep, 4);
      break;
    }
    case 5: {
      // 步骤 5：外接圆 BQC 与 AQD 交于 Y，导出全等 △YAC ≅ △YBD
      // 外接圆 BQC
      circle(cirBQC.center, cirBQC.r, {stroke: AMBER, 'stroke-width': 1.8, 'stroke-dasharray': '6 4'}, gStep);
      // 外接圆 AQD (裁剪或虚线)
      circle(cirAQD.center, cirAQD.r, {stroke: VIOLET, 'stroke-width': 1.8, 'stroke-dasharray': '6 4'}, gStep);

      // 全等三角形 YAC 与 YBD 填充
      polygon([Y, A, C], {fill: AMBER, opacity: 0.12}, gStep);
      polygon([Y, B, D], {fill: VIOLET, opacity: 0.12}, gStep);

      highlightSeg(Y, A, AMBER, gStep, 2.5);
      highlightSeg(Y, C, AMBER, gStep, 2.5);
      highlightSeg(Y, B, VIOLET, gStep, 2.5);
      highlightSeg(Y, D, VIOLET, gStep, 2.5);

      // 对应中线 YM, YN
      segDashed(Y, M, PURPLE, 2, gStep);
      segDashed(Y, N, GREEN, 2, gStep);
      tickMark(Y, M, PURPLE, gStep, 0);
      tickMark(Y, N, GREEN, gStep, 0);
      break;
    }
    case 6: {
      // 步骤 6：最终结论，四点 X, H1, Y, H2 完美共线于根轴
      // 两直径圆
      circle(M, r1, {stroke: PURPLE, 'stroke-width': 1.4, 'stroke-dasharray': '5 4', opacity: 0.45}, gStep);
      circle(N, r2, {stroke: GREEN, 'stroke-width': 1.4, 'stroke-dasharray': '5 4', opacity: 0.45}, gStep);

      // 醒目的红色贯通根轴
      extendedLine(H1, H2, 140, 60, {stroke: RED, 'stroke-width': 2.8}, gStep);

      // 高亮 X, H1, Y, H2 之间的连线段
      highlightSeg(X, H2, RED, gStep, 4.5);
      break;
    }
  }
}

/* ============ 交互控制与状态双向绑定 ============ */
let cur = 0, timer = null;
const listEl = document.getElementById('stepList');

steps.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'step-item';
  d.innerHTML = `<div class="title"><span class="badge">${i===0?'✦':i}</span>${s.title}</div>
                 <div class="body">${s.body}</div>`;
  d.onclick = () => { stopAuto(); goTo(i); };
  listEl.appendChild(d);
});

const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnAuto = document.getElementById('btnAuto');

function goTo(i){
  cur = Math.max(0, Math.min(steps.length - 1, i));
  [...listEl.children].forEach((d, k) => {
    d.classList.toggle('active', k === cur);
    d.classList.toggle('done', k < cur);
  });
  renderStep(cur);
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;
  if (listEl.children[cur]) {
    listEl.children[cur].scrollIntoView({block: 'nearest', behavior: 'smooth'});
  }
  // URL 参数双向绑定
  try {
    const url = new URL(window.location.href);
    if (url.searchParams.get('step') !== String(cur)) {
      url.searchParams.set('step', cur);
      history.replaceState(null, '', url.pathname + url.search);
    }
  } catch(e) {}

  if (typeof renderMath === 'function') {
    renderMath();
  }
  if (typeof renderMath === "function") renderMath();
}

btnPrev.onclick = () => { stopAuto(); goTo(cur - 1); };
btnNext.onclick = () => { stopAuto(); goTo(cur + 1); };
document.getElementById('btnReset').onclick = () => { stopAuto(); goTo(0);
if (typeof renderMath === 'function') renderMath(); };

function stopAuto(){
  if (timer){ clearInterval(timer); timer = null; btnAuto.textContent = '▶ 自动'; }
}

btnAuto.onclick = () => {
  if (timer){ stopAuto(); return; }
  btnAuto.textContent = '⏸ 暂停';
  if (cur >= steps.length - 1) goTo(0);
if (typeof renderMath === 'function') renderMath();
  timer = setInterval(() => {
    if (cur >= steps.length - 1){ stopAuto(); return; }
    goTo(cur + 1);
  }, 3200);
};

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'){ stopAuto(); goTo(cur - 1); }
  if (e.key === 'ArrowRight'){ stopAuto(); goTo(cur + 1); }
});

// 全局暴露便于截图与测试
window.goTo = goTo;
window.steps = steps;

// 初始化
drawBase();
const initStep = parseInt(new URLSearchParams(location.search).get('step')) || 0;
goTo(initStep);
if (typeof renderMath === 'function') renderMath();

<!-- KaTeX 动态渲染与自适应触发脚本 -->
<script>
function renderMath(target) {
  if (typeof renderMathInElement === 'function') {
    const el = (target && target.nodeType) ? target : document.body;
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      macros: {
        '\parallel': '\mathbin{/\!/}',
        '\parallelogram': '\mathbin{/\!/}',
        '\bigtriangleup': '\triangle',
        '\triangle': '\triangle'
      },
      throwOnError: false,
      strict: false
    });
  }
}
window.renderMath = renderMath;
window.addEventListener('DOMContentLoaded', () => {
  renderMath();
  let mathTimer = null;
  const observer = new MutationObserver(() => {
    if (mathTimer) clearTimeout(mathTimer);
    mathTimer = setTimeout(() => renderMath(), 30);
  });
  observer.observe(document.body, { childList: true, subtree: true });
});
window.addEventListener('load', () => renderMath());
</script>
