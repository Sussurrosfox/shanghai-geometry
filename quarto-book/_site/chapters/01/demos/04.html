<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>例 3：外角平分线与平行构造全等证明 — 分步演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: linear-gradient(135deg, #eef2f7 0%, #f8fafc 100%);
    min-height: 100vh;
    color: #1e293b;
    padding: 24px 16px;
  }
  .container { max-width: 1240px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 24px; font-weight: 700; color: #0f172a; }
  header p { font-size: 14.5px; color: #475569; margin-top: 6px; }
  .main { display: flex; gap: 20px; align-items: stretch; flex-wrap: wrap; }
  .canvas-card {
    flex: 1 1 580px; background: #fff; border-radius: 16px;
    box-shadow: 0 4px 24px rgba(15,23,42,.08); padding: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  svg { width: 100%; height: auto; max-height: 76vh; }
  .panel {
    flex: 1 1 380px; background: #fff; border-radius: 16px;
    box-shadow: 0 4px 24px rgba(15,23,42,.08); padding: 20px;
    display: flex; flex-direction: column;
  }
  .step-list { flex: 1; overflow-y: auto; margin-bottom: 14px; max-height: 60vh; }
  .step-item {
    border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 14px;
    margin-bottom: 9px; cursor: pointer; transition: all .2s;
  }
  .step-item .title { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; color: #1e293b; }
  .step-item .badge {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    background: #e2e8f0; color: #475569; font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center; font-weight: 700;
  }
  .step-item .body { font-size: 13.5px; line-height: 1.8; color: #334155; margin-top: 8px; display: none; }
  .step-item.active { border-color: #2563eb; background: #eff6ff; }
  .step-item.active .badge { background: #2563eb; color: #fff; }
  .step-item.active .body { display: block; }
  .step-item.done .badge { background: #93c5fd; color: #fff; }
  .controls { display: flex; gap: 8px; align-items: center; }
  button {
    border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px;
    cursor: pointer; font-weight: 600; transition: all .15s; font-family: inherit;
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: #2563eb; color: #fff; flex: 1; }
  .btn-primary:not(:disabled):hover { background: #1d4ed8; }
  .btn-ghost { background: #f1f5f9; color: #334155; }
  .btn-ghost:not(:disabled):hover { background: #e2e8f0; }
  .progress { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 10px; }
  kbd { background:#f1f5f9; border:1px solid #cbd5e1; border-radius:4px; padding:0 5px; font-size:12px; }

  .hl-green { color: #059669; font-weight: 600; }
  .hl-purple { color: #7c3aed; font-weight: 600; }
  .hl-red { color: #dc2626; font-weight: 600; }
  .hl-orange { color: #ea580c; font-weight: 600; }
</style>
  <!-- KaTeX 数学公式渲染引擎 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <!-- KaTeX 全局自愈渲染函数（支持动态步骤与几何宏扩展） -->
  <script>
    window.renderMath = function(target) {
      if (typeof renderMathInElement === 'function') {
        renderMathInElement(target || document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\(', right: '\)', display: false},
            {left: '\[', right: '\]', display: true}
          ],
          macros: {
            '\parallel': '\mathbin{/\\!/}',
            '\bigtriangleup': '\triangle',
            '\triangle': '\triangle',
            '\odot': '\odot',
            '\ang': '\angle',
            '\angmsd': '\angle'
          },
          ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
          throwOnError: false,
          strict: false
        });
      }
    };
  </script>

</head>
<body>
<div class="container">
  <header>
    <h1>例 3：外角平分线与平行构造全等证明</h1>
    <p>已知：$\bigtriangleup ABC$ 中 $AB < AC$，$DE$ 为 $\angle BAC$ 外角平分线，$BD \parallel AC$，$CE \parallel AB$，$F \in AC$ 且 $FC = AB$  | 求证：$DF = FE$</p>
  </header>
  <div class="main">
    <div class="canvas-card">
      <svg id="stage" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="panel">
      <div class="step-list" id="stepList"></div>
      <div class="controls">
        <button class="btn-ghost" id="btnPrev">◀ 上一步</button>
        <button class="btn-primary" id="btnNext">下一步 ▶</button>
        <button class="btn-ghost" id="btnAuto">▶ 自动</button>
        <button class="btn-ghost" id="btnReset">重置</button>
      </div>
      <div class="progress">也可用键盘 <kbd>←</kbd> <kbd>→</kbd> 切换步骤</div>
    </div>
  </div>
</div>

<script>
/* ============ 几何计算与坐标定义 ============ */
const sub = (p,q) => ({x:p.x-q.x, y:p.y-q.y});
const add = (p,q) => ({x:p.x+q.x, y:p.y+q.y});
const mul = (p,k) => ({x:p.x*k, y:p.y*k});
const mid = (p,q) => ({x:(p.x+q.x)/2, y:(p.y+q.y)/2});
const len = p => Math.hypot(p.x, p.y);
const dist = (p,q) => len(sub(p,q));
const norm = p => { const l = len(p); return l === 0 ? {x:0, y:0} : {x:p.x/l, y:p.y/l}; };
const perp = d => ({x:-d.y, y:d.x});

function lineIntersect(p1, d1, p2, d2){
  const det = d1.x*(-d2.y) - (-d2.x)*d1.y;
  if (Math.abs(det) < 1e-9) return null;
  const t = ((p2.x-p1.x)*(-d2.y) - (-d2.x)*(p2.y-p1.y)) / det;
  return add(p1, mul(d1, t));
}

/* 顶点基准定义（留白舒适、构型舒展） */
const A = {x: 298.6, y: 182.1};
const B = {x: 214.6, y: 316.5};
const C = {x: 466.6, y: 299.7};

/* 边向量与单位向量 */
const vAB = sub(B, A);
const vAC = sub(C, A);
const uAB = norm(vAB);
const uAC = norm(vAC);

/* 外角平分线方向向量（平分角 A 的补角，与内角平分线垂直） */
const dirEx = norm(sub(uAB, uAC));

/* D 是经过 B 平行于 AC 的直线与外角平分线的交点 */
const D = lineIntersect(B, vAC, A, dirEx);

/* E 是经过 C 平行于 AB 的直线与外角平分线的交点 */
const E = lineIntersect(C, vAB, A, dirEx);

/* G 是 DB 延长线与 EC 延长线的交点，使 ABGC 成为平行四边形: G = B + C - A */
const G = add(B, sub(C, A));

/* F 在线段 AC 上，使得 CF = AB */
const F = sub(C, mul(uAC, dist(A, B)));

/* ============ SVG 工具 ============ */
const NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById('stage');

function el(tag, attrs = {}, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function line(p, q, attrs, parent){
  return el('line', {x1:p.x, y1:p.y, x2:q.x, y2:q.y, ...attrs}, parent);
}

function segDashed(p, q, color, w=2, parent){
  return line(p, q, {stroke:color, 'stroke-width':w, 'stroke-dasharray':'6 4', fill:'none'}, parent);
}

function circle(c, r, attrs = {}, parent){
  return el('circle', {cx:c.x, cy:c.y, r, fill:'none', ...attrs}, parent);
}

function dot(p, color, r=4.5, parent){
  return el('circle', {cx:p.x, cy:p.y, r, fill:color, stroke:'#fff', 'stroke-width':1.5}, parent);
}

function polygon(pts, attrs = {}, parent){
  return el('polygon', {points: pts.map(p=>`${p.x},${p.y}`).join(' '), ...attrs}, parent);
}

function label(p, text, dx=0, dy=0, color='#0f172a', parent, size=17, bold=true){
  const t = el('text', {x:p.x+dx, y:p.y+dy, 'font-size':size, fill:color,
    'text-anchor':'middle', 'dominant-baseline':'central',
    'font-family':'"Times New Roman", serif', 'font-style':'italic',
    'font-weight': bold ? '700' : '400'}, parent);
  t.textContent = text;
  return t;
}

/* 等长刻度线：在 pq 中点处画横杠；offset 用于双杠/三杠 */
function tickMark(p, q, color, parent, offset=0, tickLen=6.5){
  const m = mid(p,q), d = norm(sub(q,p)), n = perp(d);
  const c = add(m, mul(d, offset));
  line(add(c, mul(n, tickLen)), add(c, mul(n, -tickLen)), {stroke:color, 'stroke-width':2.2}, parent);
}

/* 双刻度线 */
function doubleTickMark(p, q, color, parent){
  tickMark(p, q, color, parent, -3.5);
  tickMark(p, q, color, parent, 3.5);
}

/* 三刻度线 */
function tripleTickMark(p, q, color, parent){
  tickMark(p, q, color, parent, -5);
  tickMark(p, q, color, parent, 0);
  tickMark(p, q, color, parent, 5);
}

/* 平行箭头标记 */
function arrowMark(p, q, color, parent, offset=0){
  const m = add(mid(p,q), mul(norm(sub(q,p)), offset));
  const d = norm(sub(q,p)), n = perp(d);
  const tip = add(m, mul(d, 8));
  const p1 = add(add(m, mul(d, -5)), mul(n, 5));
  const p2 = add(add(m, mul(d, -5)), mul(n, -5));
  el('polygon', {points:`${tip.x},${tip.y} ${p1.x},${p1.y} ${p2.x},${p2.y}`, fill:color}, parent);
}

/* 双平行箭头标记 */
function doubleArrowMark(p, q, color, parent){
  arrowMark(p, q, color, parent, -6);
  arrowMark(p, q, color, parent, 6);
}

/* 高亮线段（底层微光 + 上层饱满色彩） */
function highlightSeg(p, q, color, parent, w=4){
  line(p, q, {stroke:color, 'stroke-width':w+5, 'stroke-linecap':'round', opacity:.22}, parent);
  line(p, q, {stroke:color, 'stroke-width':w, 'stroke-linecap':'round'}, parent);
}

/* 精确画劣角弧线：从边 v->p1 旋转到边 v->p2 */
function drawAngleArc(v, p1, p2, r=22, attrs={}, parent){
  const d1 = sub(p1, v), d2 = sub(p2, v);
  const a1 = Math.atan2(d1.y, d1.x);
  const a2 = Math.atan2(d2.y, d2.x);
  let diff = a2 - a1;
  while (diff > Math.PI) diff -= 2 * Math.PI;
  while (diff < -Math.PI) diff += 2 * Math.PI;
  const sweep = diff > 0 ? 1 : 0;
  const s = { x: v.x + r * Math.cos(a1), y: v.y + r * Math.sin(a1) };
  const e = { x: v.x + r * Math.cos(a2), y: v.y + r * Math.sin(a2) };
  return el('path', {
    d: `M ${s.x} ${s.y} A ${r} ${r} 0 0 ${sweep} ${e.x} ${e.y}`,
    fill: 'none', stroke: '#dc2626', 'stroke-width': 2, ...attrs
  }, parent);
}

/* ============ 分层绘制容器 ============ */
const gBase = el('g', {id: 'gBase'}, stage);      // 底层：基础构型
const gStep = el('g', {id: 'gStep'}, stage);      // 动态步骤层
const gPts  = el('g', {id: 'gPts'}, stage);       // 顶层：点与标签

/* 绘制常驻基础构型 */
function drawBase(){
  gBase.innerHTML = '';

  // 贯穿 D-A-E 的外角平分线（两端适当外延）
  const extD = sub(D, mul(norm(sub(A, D)), 30));
  const extE = add(E, mul(norm(sub(E, A)), 30));
  line(extD, extE, {stroke: '#94a3b8', 'stroke-width': 1.8, 'stroke-dasharray': '5 4'}, gBase);

  // 三角形 ABC
  polygon([A, B, C], {fill: '#f8fafc', stroke: '#334155', 'stroke-width': 2.4, 'stroke-linejoin': 'round'}, gBase);

  // 线段 BD 与 CE
  line(B, D, {stroke: '#475569', 'stroke-width': 2}, gBase);
  line(C, E, {stroke: '#475569', 'stroke-width': 2}, gBase);
}

/* 绘制顶层点与标签 */
function drawPoints(showG = false){
  gPts.innerHTML = '';

  // 基础点：A, B, C, D, E, F
  dot(A, '#0f172a', 4.5, gPts);
  label(A, 'A', 0, -18, '#0f172a', gPts);

  dot(B, '#0f172a', 4.5, gPts);
  label(B, 'B', -18, 8, '#0f172a', gPts);

  dot(C, '#0f172a', 4.5, gPts);
  label(C, 'C', 18, 8, '#0f172a', gPts);

  dot(D, '#0f172a', 4.5, gPts);
  label(D, 'D', -10, -16, '#0f172a', gPts);

  dot(E, '#0f172a', 4.5, gPts);
  label(E, 'E', 16, 12, '#0f172a', gPts);

  dot(F, '#0f172a', 4.5, gPts);
  label(F, 'F', 2, -18, '#0f172a', gPts);

  // 辅助点 G 在步骤 1 及之后出现
  if (showG){
    dot(G, '#0284c7', 5, gPts);
    label(G, 'G', 0, 22, '#0284c7', gPts);
  }
}

/* ============ 各步骤动态画面渲染 ============ */
const BLUE = '#2563eb', GREEN = '#059669', RED = '#dc2626',
      PURPLE = '#7c3aed', CYAN = '#0891b2', ORANGE = '#ea580c';

function renderStep(s){
  gStep.innerHTML = '';
  drawPoints(s >= 1);

  switch(s){
    case 0: {
      // Step 0: 题设条件高亮
      // 平行标记：BD // AC, CE // AB
      arrowMark(D, B, '#64748b', gStep, 0);
      arrowMark(A, C, '#64748b', gStep, -20);

      doubleArrowMark(A, B, '#64748b', gStep, 0);
      doubleArrowMark(E, C, '#64748b', gStep, 0);

      // 已知 CF = AB
      highlightSeg(A, B, '#64748b', gStep, 3);
      highlightSeg(F, C, '#64748b', gStep, 3);
      tickMark(A, B, '#475569', gStep);
      tickMark(F, C, '#475569', gStep);
      break;
    }

    case 1: {
      // Step 1: 延长 DB, EC 交于 G，连接 GF；构造平行四边形 ABGC
      // 虚线延长 BG, CG
      segDashed(B, G, CYAN, 2.2, gStep);
      segDashed(C, G, CYAN, 2.2, gStep);
      segDashed(G, F, PURPLE, 2.2, gStep);

      // 平行四边形 ABGC 浅色填充与边界
      polygon([A, B, G, C], {fill: CYAN, opacity: 0.1, stroke: CYAN, 'stroke-width': 2, 'stroke-dasharray': '5 3'}, gStep);

      // 平行标记
      arrowMark(B, G, CYAN, gStep, 0);
      arrowMark(A, C, CYAN, gStep, -20);
      doubleArrowMark(A, B, CYAN, gStep, 0);
      doubleArrowMark(C, G, CYAN, gStep, 0);
      break;
    }

    case 2: {
      // Step 2: 证明 DG = GE
      // 保持完整的辅助线框架
      segDashed(B, G, '#94a3b8', 1.8, gStep);
      segDashed(C, G, '#94a3b8', 1.8, gStep);
      segDashed(G, F, '#94a3b8', 1.6, gStep);

      // 高亮大等腰三角形 DEG
      polygon([D, E, G], {fill: BLUE, opacity: 0.08}, gStep);
      highlightSeg(D, G, BLUE, gStep, 3.5);
      highlightSeg(E, G, BLUE, gStep, 3.5);
      doubleTickMark(D, G, BLUE, gStep);
      doubleTickMark(E, G, BLUE, gStep);

      // 标出四组等角：∠DAB, ∠EAC 与内错角 ∠DEG, ∠ADG
      drawAngleArc(A, D, B, 26, {stroke: ORANGE, 'stroke-width': 2.2}, gStep);
      drawAngleArc(A, E, C, 26, {stroke: ORANGE, 'stroke-width': 2.2}, gStep);
      drawAngleArc(E, D, G, 30, {stroke: BLUE, 'stroke-width': 2.2}, gStep);
      drawAngleArc(D, E, G, 30, {stroke: BLUE, 'stroke-width': 2.2}, gStep);
      break;
    }

    case 3: {
      // Step 3: 平行四边形对边相等与条件转化得 CG = CF
      segDashed(B, G, '#94a3b8', 1.8, gStep);
      segDashed(C, G, GREEN, 2.2, gStep);
      segDashed(G, F, GREEN, 2, gStep);

      // 等腰三角形 CGF 浅绿填充
      polygon([C, G, F], {fill: GREEN, opacity: 0.14, stroke: GREEN, 'stroke-width': 2}, gStep);

      // 三条等长线段高亮：AB, CG, CF
      highlightSeg(A, B, GREEN, gStep, 3.5);
      highlightSeg(C, G, GREEN, gStep, 3.5);
      highlightSeg(C, F, GREEN, gStep, 3.5);
      tickMark(A, B, GREEN, gStep);
      tickMark(C, G, GREEN, gStep);
      tickMark(C, F, GREEN, gStep);

      // 底角弧：∠CGF 与 ∠CFG
      drawAngleArc(G, C, F, 24, {stroke: GREEN, 'stroke-width': 2.2}, gStep);
      drawAngleArc(F, C, G, 24, {stroke: GREEN, 'stroke-width': 2.2}, gStep);
      break;
    }

    case 4: {
      // Step 4: 内错角转化，说明 GF 是 ∠DGE 的角平分线
      segDashed(B, G, '#94a3b8', 1.8, gStep);
      segDashed(C, G, '#94a3b8', 1.8, gStep);

      // 高亮轴对称线段 GF
      highlightSeg(G, F, PURPLE, gStep, 3.5);

      // 内错角：∠CFG 与 ∠FGB
      drawAngleArc(F, C, G, 24, {stroke: GREEN, 'stroke-width': 1.8, 'stroke-dasharray':'3 2'}, gStep);
      drawAngleArc(G, F, B, 26, {stroke: PURPLE, 'stroke-width': 2.2}, gStep);

      // 对顶分角：∠FGD 与 ∠FGE 相等
      drawAngleArc(G, D, F, 34, {stroke: PURPLE, 'stroke-width': 2.4}, gStep);
      drawAngleArc(G, F, E, 34, {stroke: PURPLE, 'stroke-width': 2.4}, gStep);
      break;
    }

    case 5: {
      // Step 5: 全等三角形 △DFG ≌ △EFG 与最终结论 DF = FE
      // 辅助结构连线
      segDashed(B, G, '#94a3b8', 1.6, gStep);
      segDashed(C, G, '#94a3b8', 1.6, gStep);

      // 全等三角形半透明填充
      polygon([D, F, G], {fill: BLUE, opacity: 0.16, stroke: BLUE, 'stroke-width': 1.8}, gStep);
      polygon([E, F, G], {fill: ORANGE, opacity: 0.16, stroke: ORANGE, 'stroke-width': 1.8}, gStep);

      // 对应边与角高亮
      doubleTickMark(D, G, BLUE, gStep);
      doubleTickMark(E, G, BLUE, gStep);
      highlightSeg(G, F, PURPLE, gStep, 3);
      drawAngleArc(G, D, F, 32, {stroke: PURPLE, 'stroke-width': 2.2}, gStep);
      drawAngleArc(G, F, E, 32, {stroke: PURPLE, 'stroke-width': 2.2}, gStep);

      // 最终结论：连结并高亮 DF 与 EF（红实线加发光）
      highlightSeg(D, F, RED, gStep, 4.2);
      highlightSeg(E, F, RED, gStep, 4.2);
      tripleTickMark(D, F, RED, gStep);
      tripleTickMark(E, F, RED, gStep);
      break;
    }
  }

  if (typeof window.renderMath === 'function') window.renderMath();
}

/* ============ 步骤文本 ============ */
const steps = [
  {
    title: '已知条件与几何图形',
    body: `在 $\\bigtriangleup ABC$ 中，$AB < AC$。<br>
           直线 $DE$ 为 $\\angle BAC$ 的外角平分线。<br>
           过点 $B$ 作 $BD \\parallel AC$ 交外角平分线于 $D$；<br>
           过点 $C$ 作 $CE \\parallel AB$ 交外角平分线于 $E$。<br>
           点 $F$ 是边 $AC$ 上一点，使得 <span class="hl-blue">$FC = AB$</span>。<br>
           求证：<span class="hl-red">$DF = FE$</span>。`
  },
  {
    title: '① 延长 DB、EC 构造平行四边形 ABGC',
    body: `延长 $DB$ 与 $EC$ 交于点 $G$，连接虚线 $GF$。<br>
           由题设平行作法：<br>
           $\\because DG \\parallel AC$（即 $BG \\parallel AC$），$EG \\parallel AB$（即 $CG \\parallel AB$），<br>
           $\\therefore$ 四边形 <span class="hl-blue">$ABGC$ 为平行四边形</span>。<br>
           这一辅助平行四边形将分散的边长与平行条件统一串联起来。`
  },
  {
    title: '② 外角平分线与平行线性质 ⇒ DG = GE',
    body: `由 $EG \\parallel AB$ 且直线 $DE$ 为截线，得内错角 <span class="hl-blue">$\\angle DEG = \\angle DAB$</span>；<br>
           同理由 $DG \\parallel AC$，得内错角 <span class="hl-blue">$\\angle ADG = \\angle EAC$</span>。<br>
           又因为 $DE$ 是 $\\angle BAC$ 的外角平分线，由平角两旁的对称性可知：<br>
           <span class="hl-orange">$\\angle DAB = \\angle EAC = \\frac{180^\\circ - \\angle BAC}{2}$</span>。<br>
           等量代换得：$\\angle DEG = \\angle ADG$。<br>
           在 $\\bigtriangleup DEG$ 中两底角相等，故 $\\bigtriangleup DEG$ 为等腰三角形，即 <span class="hl-blue"><b>$DG = GE$</b></span>。`
  },
  {
    title: '③ 利用平行四边形转化条件 ⇒ CG = CF',
    body: `由平行四边形 $ABGC$ 对边相等，得 <span class="hl-green">$CG = AB$</span>。<br>
           结合已知条件 <span class="hl-green">$FC = AB$</span>，立即得到：<br>
           <span class="hl-green"><b>$CG = CF$</b></span>。<br>
           因此 $\\bigtriangleup CGF$ 是以 $C$ 为顶点的等腰三角形，两底角相等：<br>
           <span class="hl-green">$\\angle CGF = \\angle CFG$</span>。`
  },
  {
    title: '④ 内错角转化得出 GF 平分 ∠DGE',
    body: `由 $BG \\parallel AC$，以 $GF$ 为截线，内错角相等：<br>
           <span class="hl-purple">$\\angle FGB = \\angle CFG$</span>。<br>
           结合步骤 3 的等腰底角关系 $\\angle CGF = \\angle CFG$，推得：<br>
           $\\angle FGB = \\angle CGF$。<br>
           因为点 $B$ 在线段 $GD$ 上，点 $C$ 在线段 $GE$ 上，故：<br>
           $\\angle FGD = \\angle FGB$，$\\angle FGE = \\angle CGF$。<br>
           因此 <span class="hl-purple"><b>$\\angle FGD = \\angle FGE$</b></span>，即射线 $GF$ 为 $\\angle DGE$ 的角平分线！`
  },
  {
    title: '⑤ SAS 判定 △DFG ≌ △EFG ⇒ DF = FE',
    body: `在 $\\bigtriangleup DFG$ 与 $\\bigtriangleup EFG$ 中：<br>
           1. <span class="hl-blue">$DG = GE$</span>（步骤 2 已证）；<br>
           2. <span class="hl-purple">$\\angle FGD = \\angle FGE$</span>（步骤 4 已证）；<br>
           3. <span class="hl-purple">$FG = FG$</span>（公共边）。<br>
           由<b>边角边（SAS）</b>全等判定定理，可得：<br>
           <span class="hl-blue">$\\bigtriangleup DFG \\cong \\bigtriangleup EFG$</span>。<br>
           全等三角形对应边相等，故 <span class="hl-red"><b>$DF = FE$</b></span>。命题得证！`
  }
];

/* ============ 交互控制 ============ */
let cur = 0, timer = null;
const listEl = document.getElementById('stepList');

steps.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'step-item';
  d.innerHTML = `<div class="title"><span class="badge">${i===0?'✦':i}</span>${s.title}</div>
                 <div class="body">${s.body}</div>`;
  d.onclick = () => { stopAuto(); goTo(i); };
  listEl.appendChild(d);
});
if (typeof window.renderMath === 'function') window.renderMath(listEl);

const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnAuto = document.getElementById('btnAuto');

function goTo(i){
  cur = Math.max(0, Math.min(steps.length-1, i));
  [...listEl.children].forEach((d, k) => {
    d.classList.toggle('active', k === cur);
    d.classList.toggle('done', k < cur);
  });
  renderStep(cur);
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;
  if (listEl.children[cur]) {
    listEl.children[cur].scrollIntoView({block:'nearest', behavior:'smooth'});
  }

  if (typeof window.renderMath === 'function') window.renderMath();
  if (typeof renderMath === "function") renderMath();
}

btnPrev.onclick = () => { stopAuto(); goTo(cur-1); };
btnNext.onclick = () => { stopAuto(); goTo(cur+1); };
document.getElementById('btnReset').onclick = () => { stopAuto(); goTo(0); };

function stopAuto(){
  if (timer){ clearInterval(timer); timer = null; btnAuto.textContent = '▶ 自动'; }
}

btnAuto.onclick = () => {
  if (timer){ stopAuto(); return; }
  btnAuto.textContent = '⏸ 暂停';
  if (cur >= steps.length - 1) goTo(0);
  timer = setInterval(() => {
    if (cur >= steps.length - 1){ stopAuto(); return; }
    goTo(cur + 1);
  }, 2600);
};

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'){ stopAuto(); goTo(cur-1); }
  if (e.key === 'ArrowRight'){ stopAuto(); goTo(cur+1); }
});

drawBase();
goTo(parseInt(new URLSearchParams(location.search).get('step')) || 0);
</script>

<!-- KaTeX 动态渲染与自适应触发脚本 -->
<script>
function renderMath(target) {
  if (typeof renderMathInElement === 'function') {
    const el = (target && target.nodeType) ? target : document.body;
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      macros: {
        '\parallel': '\mathbin{/\!/}',
        '\parallelogram': '\mathbin{/\!/}',
        '\bigtriangleup': '\triangle',
        '\triangle': '\triangle'
      },
      throwOnError: false,
      strict: false
    });
  }
}
window.renderMath = renderMath;
window.addEventListener('DOMContentLoaded', () => {
  renderMath();
  let mathTimer = null;
  const observer = new MutationObserver(() => {
    if (mathTimer) clearTimeout(mathTimer);
    mathTimer = setTimeout(() => renderMath(), 30);
  });
  observer.observe(document.body, { childList: true, subtree: true });
});
window.addEventListener('load', () => renderMath());
</script>
