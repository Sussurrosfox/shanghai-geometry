<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>例 1 直角垂足、中位线与角相等 — 分步证明演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: linear-gradient(135deg, #eef2f7 0%, #f8fafc 100%);

  header p { font-size: 14.5px; color: #475569; margin-top: 6px; }

  }
  svg { width: 100%; height: auto; max-height: 76vh; }
  .panel {
    flex: 1 1 380px; background: #fff; border-radius: 16px;
    box-shadow: 0 4px 24px rgba(15,23,42,.08); padding: 20px;
    display: flex; flex-direction: column;
  }
  .step-list { flex: 1; overflow-y: auto; margin-bottom: 14px; }
  .step-item {
    border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 14px;

  .step-item .badge {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    background: #e2e8f0; color: #475569; font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center; font-weight: 700;
  }
  .step-item .body { font-size: 13.5px; line-height: 1.75; color: #334155; margin-top: 8px; display: none; }
  .step-item.active { border-color: #2563eb; background: #eff6ff; }
  .step-item.active .badge { background: #2563eb; color: #fff; }

</style>
  <!-- KaTeX 数学公式渲染引擎 -->

</head>
<body>
<div class="container">
  <header>
    <h1>例 1 中位线、直角斜边中线与角相等证明</h1>
    <p>已知 $O$ 为 $\triangle ABC$ 内一点，$OD \perp BC, OE \perp AC$，$F$ 为 $AB$ 中点，且 $DF = EF$。求证：$\angle OBD = \angle OAE$。</p>
  </header>
  <div class="main">
    <div class="canvas-card">
      <svg id="stage" viewBox="0 0 640 540" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="panel">
      <div class="step-list" id="stepList"></div>
      <div class="controls">
        <button class="btn-ghost" id="btnPrev">◀ 上一步</button>
        <button class="btn-primary" id="btnNext">下一步 ▶</button>
        <button class="btn-ghost" id="btnAuto">▶ 自动</button>
        <button class="btn-ghost" id="btnReset">重置</button>
      </div>
      <div class="progress">也可用键盘 <kbd>←</kbd> <kbd>→</kbd> 切换步骤</div>
    </div>
  </div>
</div>

<script>
/* ============ 几何定义与精确坐标 ============ */
const sub = (p,q) => ({x:p.x-q.x, y:p.y-q.y});
const add = (p,q) => ({x:p.x+q.x, y:p.y+q.y});
const mul = (p,k) => ({x:p.x*k, y:p.y*k});
const mid = (p,q) => ({x:(p.x+q.x)/2, y:(p.y+q.y)/2});
const len = p => Math.hypot(p.x, p.y);
const dist = (p,q) => len(sub(p,q));
const norm = p => { const l = len(p); return l === 0 ? {x:0, y:0} : {x:p.x/l, y:p.y/l}; };
const perp = d => ({x:-d.y, y:d.x});

/* 精确几何顶点与关键点（由 Wolfram MCP 高精度求解，满足 DF == EF 严格相等且构型舒展） */
const A = { x: 220, y: 120 };
const B = { x: 60,  y: 480 };
const C = { x: 580, y: 480 };
const O = { x: 280, y: 350.79 };
const D = { x: 280, y: 480 };
const E = { x: 365.39, y: 265.39 };
const F = mid(A, B);  // { x: 140, y: 300 }
const M = mid(A, O);  // { x: 250, y: 235.395 }
const N = mid(B, O);  // { x: 170, y: 415.395 }

/* ============ SVG 工具函数 ============ */
const NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById('stage');
function el(tag, attrs = {}, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function line(p, q, attrs, parent){
  return el('line', {x1:p.x, y1:p.y, x2:q.x, y2:q.y, ...attrs}, parent);
}
function segDashed(p, q, color, w=1.8, parent){
  return line(p, q, {stroke:color, 'stroke-width':w, 'stroke-dasharray':'6 4', fill:'none'}, parent);
}
function dot(p, color, r=4.5, parent){
  return el('circle', {cx:p.x, cy:p.y, r, fill:color, stroke:'#fff', 'stroke-width':1.5}, parent);
}
function polygon(pts, attrs = {}, parent){
  return el('polygon', {points: pts.map(p=>`${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' '), ...attrs}, parent);
}
function label(p, text, dx=0, dy=0, color='#0f172a', parent, size=16, bold=true){
  const t = el('text', {x:p.x+dx, y:p.y+dy, 'font-size':size, fill:color,
    'text-anchor':'middle', 'dominant-baseline':'central',
    'font-family':'"Times New Roman", serif', 'font-style':'italic',
    'font-weight': bold ? '700' : '500'}, parent);
  t.textContent = text;
  return t;
}
function rightAngleMark(v, p1, p2, s=12, color='#dc2626', parent){
  const u1 = norm(sub(p1,v)), u2 = norm(sub(p2,v));
  const a = add(v, mul(u1,s)), b = add(add(v, mul(u1,s)), mul(u2,s)), c = add(v, mul(u2,s));
  return el('polyline', {points:`${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y}`,
    fill:'none', stroke:color, 'stroke-width':1.8}, parent);
}
function tickMark(p, q, color, parent, offset=0, lenHalf=5){
  const m = mid(p,q), d = norm(sub(q,p)), n = perp(d);
  const c = add(m, mul(d, offset));
  line(add(c, mul(n, lenHalf)), add(c, mul(n, -lenHalf)), {stroke:color, 'stroke-width':2.2}, parent);
}
function arrowMark(p, q, color, parent){
  const m = mid(p,q), d = norm(sub(q,p)), n = perp(d);
  const tip = add(m, mul(d, 8));
  const p1 = add(add(m, mul(d, -5)), mul(n, 5));
  const p2 = add(add(m, mul(d, -5)), mul(n, -5));
  el('polygon', {points:`${tip.x},${tip.y} ${p1.x},${p1.y} ${p2.x},${p2.y}`, fill:color}, parent);
}
function highlightSeg(p, q, color, parent, w=4){
  line(p, q, {stroke:color, 'stroke-width':w+6, 'stroke-linecap':'round', opacity:.22}, parent);
  line(p, q, {stroke:color, 'stroke-width':w, 'stroke-linecap':'round'}, parent);
}
function angleArc(v, p1, p2, r=20, attrs={}, parent){
  let a1 = Math.atan2(p1.y - v.y, p1.x - v.x);
  let a2 = Math.atan2(p2.y - v.y, p2.x - v.x);
  let diff = a2 - a1;
  while (diff < -Math.PI) diff += Math.PI * 2;
  while (diff > Math.PI) diff -= Math.PI * 2;
  const sweep = diff > 0 ? 1 : 0;
  const s = { x: v.x + r * Math.cos(a1), y: v.y + r * Math.sin(a1) };
  const e = { x: v.x + r * Math.cos(a1 + diff), y: v.y + r * Math.sin(a1 + diff) };
  return el('path', {
    d: `M ${s.x.toFixed(2)} ${s.y.toFixed(2)} A ${r} ${r} 0 0 ${sweep} ${e.x.toFixed(2)} ${e.y.toFixed(2)}`,
    fill: 'none', stroke: attrs.stroke || '#dc2626', 'stroke-width': attrs['stroke-width'] || 2, ...attrs
  }, parent);
}

/* ============ 分层架构 ============ */
const gBase = el('g', {id: 'gBase'}, stage);
const gStep = el('g', {id: 'gStep'}, stage);
const gPts  = el('g', {id: 'gPts'}, stage);

/* 全局颜色定义 */
const BLUE = '#2563eb', GREEN = '#059669', RED = '#dc2626',
      PURPLE = '#7c3aed', CYAN = '#0891b2', ORANGE = '#ea580c',
      GOLD = '#d97706', SLATE = '#64748b';

function drawBase(){
  gBase.innerHTML = '';
  // 三角形 ABC 基础骨架
  polygon([A, B, C], {fill:'#f8fafc', stroke:'#334155', 'stroke-width':2.2}, gBase);
  // 垂线段 OD 与 OE（基础线段）
  line(O, D, {stroke:'#64748b', 'stroke-width':1.6}, gBase);
  line(O, E, {stroke:'#64748b', 'stroke-width':1.6}, gBase);
  // 直角符号
  rightAngleMark(D, B, O, 11, '#64748b', gBase);
  rightAngleMark(E, C, O, 11, '#64748b', gBase);
}

function drawPoints(showMN = false){
  gPts.innerHTML = '';
  // 基础点
  dot(A, '#0f172a', 4.5, gPts); label(A, 'A', 0, -18, '#0f172a', gPts);
  dot(B, '#0f172a', 4.5, gPts); label(B, 'B', -16, 16, '#0f172a', gPts);
  dot(C, '#0f172a', 4.5, gPts); label(C, 'C', 16, 16, '#0f172a', gPts);
  dot(O, '#0f172a', 4.5, gPts); label(O, 'O', 18, 6, '#0f172a', gPts);
  dot(D, '#0f172a', 4.5, gPts); label(D, 'D', 0, 18, '#0f172a', gPts);
  dot(E, '#0f172a', 4.5, gPts); label(E, 'E', 16, -14, '#0f172a', gPts);
  dot(F, '#0f172a', 4.5, gPts); label(F, 'F', -18, -6, '#0f172a', gPts);

  // 辅助中点 M, N
  if (showMN) {
    dot(M, PURPLE, 4.5, gPts); label(M, 'M', 14, -14, PURPLE, gPts);
    dot(N, BLUE, 4.5, gPts);   label(N, 'N', 0, 18, BLUE, gPts);
  }
}

/* ============ 各步骤画面图元渲染 ============ */
function renderStep(s){
  gStep.innerHTML = ''; // 擦除前一步动态图元
  drawPoints(s >= 1);   // Step 1 起出现点 M 和 N

  switch(s){
    case 0: // 已知条件
      // 中点 F 标记：在 AF, FB 上标注单刻度
      tickMark(A, F, '#475569', gStep, 0, 5);
      tickMark(F, B, '#475569', gStep, 0, 5);
      // 已知 DF = EF
      highlightSeg(D, F, RED, gStep, 3);
      highlightSeg(E, F, RED, gStep, 3);
      tickMark(D, F, RED, gStep, -3, 6);
      tickMark(D, F, RED, gStep, 3, 6);
      tickMark(E, F, RED, gStep, -3, 6);
      tickMark(E, F, RED, gStep, 3, 6);
      break;

    case 1: // ① 作辅助线：取 AO, BO 中点 M, N
      // 辅助连线 AO, BO
      segDashed(A, O, '#64748b', 1.5, gStep);
      segDashed(B, O, '#64748b', 1.5, gStep);
      // 构造连线 ME, MF, ND, NF
      line(M, E, {stroke:GREEN, 'stroke-width':2}, gStep);
      line(M, F, {stroke:GREEN, 'stroke-width':2}, gStep);
      line(N, D, {stroke:GREEN, 'stroke-width':2}, gStep);
      line(N, F, {stroke:GREEN, 'stroke-width':2}, gStep);
      // 保留细虚线 DF, EF
      segDashed(D, F, RED, 1.5, gStep);
      segDashed(E, F, RED, 1.5, gStep);
      break;

    case 2: // ② 第一组等长：FM = ND = 1/2 BO
      // 背景基准直角三角形 Rt△ODB
      polygon([O, D, B], {fill:BLUE, opacity:0.1}, gStep);
      rightAngleMark(D, B, O, 12, RED, gStep);
      // 粗线高亮基准线段 BO
      highlightSeg(B, O, BLUE, gStep, 3.5);
      // 中点 N 标识
      tickMark(B, N, BLUE, gStep, 0, 4);
      tickMark(N, O, BLUE, gStep, 0, 4);
      // 高亮 FM 与 ND
      highlightSeg(F, M, BLUE, gStep, 3);
      highlightSeg(N, D, BLUE, gStep, 3);
      tickMark(F, M, BLUE, gStep, 0, 6);
      tickMark(N, D, BLUE, gStep, 0, 6);
      // 弱化其他连线
      segDashed(A, O, '#cbd5e1', 1.2, gStep);
      segDashed(M, E, '#cbd5e1', 1.2, gStep);
      segDashed(N, F, '#cbd5e1', 1.2, gStep);
      break;

    case 3: // ③ 第二组等长：FN = ME = 1/2 AO
      // 背景基准直角三角形 Rt△OEA
      polygon([O, E, A], {fill:PURPLE, opacity:0.1}, gStep);
      rightAngleMark(E, C, O, 12, RED, gStep);
      // 粗线高亮基准线段 AO
      highlightSeg(A, O, PURPLE, gStep, 3.5);
      // 中点 M 标识
      tickMark(A, M, PURPLE, gStep, -2.5, 4); tickMark(A, M, PURPLE, gStep, 2.5, 4);
      tickMark(M, O, PURPLE, gStep, -2.5, 4); tickMark(M, O, PURPLE, gStep, 2.5, 4);
      // 高亮 FN 与 ME
      highlightSeg(F, N, PURPLE, gStep, 3);
      highlightSeg(M, E, PURPLE, gStep, 3);
      tickMark(F, N, PURPLE, gStep, -2.5, 6); tickMark(F, N, PURPLE, gStep, 2.5, 6);
      tickMark(M, E, PURPLE, gStep, -2.5, 6); tickMark(M, E, PURPLE, gStep, 2.5, 6);
      // 弱化其他连线
      segDashed(B, O, '#cbd5e1', 1.2, gStep);
      segDashed(F, M, '#cbd5e1', 1.2, gStep);
      segDashed(N, D, '#cbd5e1', 1.2, gStep);
      break;

    case 4: // ④ 构造 SSS 全等：△FND ≅ △EMF
      // 填充全等三角形面
      polygon([F, N, D], {fill:BLUE, opacity:0.25}, gStep);
      polygon([E, M, F], {fill:ORANGE, opacity:0.25}, gStep);
      // 标出三组对应等长边
      // 1. FN = ME
      line(F, N, {stroke:PURPLE, 'stroke-width':3}, gStep);
      line(M, E, {stroke:PURPLE, 'stroke-width':3}, gStep);
      // 2. ND = FM
      line(N, D, {stroke:BLUE, 'stroke-width':3}, gStep);
      line(F, M, {stroke:BLUE, 'stroke-width':3}, gStep);
      // 3. DF = EF (已知)
      line(D, F, {stroke:RED, 'stroke-width':3}, gStep);
      line(E, F, {stroke:RED, 'stroke-width':3}, gStep);
      // 对应顶角相等 ∠FND = ∠FME
      angleArc(N, F, D, 24, {stroke:GOLD, 'stroke-width':2.6}, gStep);
      angleArc(M, E, F, 24, {stroke:GOLD, 'stroke-width':2.6}, gStep);
      break;

    case 5: // ⑤ 平行四边形 FNOM 转换顶角
      // 平行四边形 FNOM 高亮边框与轻底色
      polygon([F, N, O, M], {fill:CYAN, opacity:0.15, stroke:CYAN, 'stroke-width':2.4}, gStep);
      // 平行箭头标记
      arrowMark(F, M, CYAN, gStep);
      arrowMark(N, O, CYAN, gStep);
      // 对角相等 ∠FNO = ∠FMO
      angleArc(N, F, O, 18, {stroke:CYAN, 'stroke-width':2.2}, gStep);
      angleArc(M, O, F, 18, {stroke:CYAN, 'stroke-width':2.2}, gStep);
      // 全等角（弱化）
      line(N, D, {stroke:'#64748b', 'stroke-width':1.5}, gStep);
      line(M, E, {stroke:'#64748b', 'stroke-width':1.5}, gStep);
      // 差角 ∠OND 与 ∠OME 红色高亮
      angleArc(N, O, D, 26, {stroke:RED, 'stroke-width':2.6}, gStep);
      angleArc(M, E, O, 26, {stroke:RED, 'stroke-width':2.6}, gStep);
      break;

    case 6: // ⑥ 利用等腰三角形外角推得 ∠OBD = ∠OAE
      // 浅色突出两个直角三角形
      polygon([O, D, B], {fill:BLUE, opacity:0.12}, gStep);
      polygon([O, E, A], {fill:GREEN, opacity:0.12}, gStep);
      // 高亮 AO 与 BO
      highlightSeg(B, O, BLUE, gStep, 2.5);
      highlightSeg(A, O, GREEN, gStep, 2.5);
      // 保持 ND 与 ME 辅助线
      line(N, D, {stroke:BLUE, 'stroke-width':1.8}, gStep);
      line(M, E, {stroke:GREEN, 'stroke-width':1.8}, gStep);
      // 外角弧 ∠OND 与 ∠OME
      angleArc(N, O, D, 22, {stroke:RED, 'stroke-width':2}, gStep);
      angleArc(M, E, O, 22, {stroke:RED, 'stroke-width':2}, gStep);
      // 目标角 ∠OBD 与 ∠OAE 极显高亮
      angleArc(B, D, O, 32, {stroke:GOLD, 'stroke-width':3}, gStep);
      angleArc(A, O, E, 32, {stroke:GOLD, 'stroke-width':3}, gStep);
      // 目标角文本注记
      label({x:B.x+36, y:B.y-12}, 'α', 0, 0, GOLD, gStep, 17, true);
      label({x:A.x+18, y:A.y+36}, 'α', 0, 0, GOLD, gStep, 17, true);
      break;
  }

  if (typeof window.renderMath === 'function') window.renderMath();
}

/* ============ 步骤文本内容 ============ */
const steps = [
  {
    title: '已知条件与图形构形',
    body: `已知 $O$ 为 $\\triangle ABC$ 内一点，满足 <b>$OD \\perp BC$</b> 于点 $D$，$OE \\perp AC$ 于点 $E$。<br>
           $F$ 为边 $AB$ 的中点，且满足 <b>$DF = EF$</b>（画面红线标出）。<br>
           求证：<b style="color:#2563eb;">$\\angle OBD = \\angle OAE$</b>。`
  },
  {
    title: '① 取中点构造中位线与斜边中线',
    body: `看到中点构造中位线，看到直角三角形斜边构造斜边中线。<br>
           分别取 $AO, BO$ 的中点 <b>$M$</b> 与 <b>$N$</b>。<br>
           连接 $AO, BO$，并连接 <b>$ME, MF, ND, NF$</b>。<br>
           此时 $F, M, N$ 构成中位线体系，而 $M, N$ 又是直角三角形斜边中点！`
  },
  {
    title: '② $FM$ 与 $ND$ 均等于 $\\frac{1}{2}BO$',
    body: `在 $\\triangle ABO$ 中，$F, M$ 分别为 $AB, AO$ 的中点，故 $FM$ 为中位线，有：<br>
           <b>$FM = \\frac{1}{2}BO$</b>。<br>
           在 $\\text{Rt}\\triangle ODB$ 中，$OD \\perp BC$，$N$ 为斜边 $BO$ 的中点，由直角三角形斜边中线定理得：<br>
           <b>$ND = \\frac{1}{2}BO$</b>。<br>
           因此得出第一组关键等长：<b style="color:#2563eb;">$FM = ND$</b>。`
  },
  {
    title: '③ $FN$ 与 $ME$ 均等于 $\\frac{1}{2}AO$',
    body: `同理，在 $\\triangle ABO$ 中，$F, N$ 分别为 $AB, BO$ 的中点，故 $FN$ 为中位线，有：<br>
           <b>$FN = \\frac{1}{2}AO$</b>。<br>
           在 $\\text{Rt}\\triangle OEA$ 中，$OE \\perp AC$，$M$ 为斜边 $AO$ 的中点，由直角三角形斜边中线定理得：<br>
           <b>$ME = \\frac{1}{2}AO$</b>。<br>
           因此得出第二组关键等长：<b style="color:#7c3aed;">$ME = FN$</b>。`
  },
  {
    title: '④ 构造 SSS 全等：$\\triangle FND \\cong \\triangle EMF$',
    body: `在 $\\triangle FND$ 和 $\\triangle EMF$ 中对照三边：<br>
           $\\begin{cases} FN = ME & (\\text{由步骤 3}) \\\\ ND = FM & (\\text{由步骤 2}) \\\\ DF = EF & (\\text{已知条件}) \\end{cases}$<br>
           由 <b>SSS</b> 全等判定定理，得 <b>$\\triangle FND \\cong \\triangle EMF$</b>！<br>
           对应角相等：<b style="color:#d97706;">$\\angle FND = \\angle FME$</b>。`
  },
  {
    title: '⑤ 平行四边形 $FNOM$ 转换顶角',
    body: `因 $FM \\parallel BO$ 且 $FM = ON = \\frac{1}{2}BO$，故四边形 <b>$FNOM$ 为平行四边形</b>。<br>
           平行四边形对角相等：<b>$\\angle FNO = \\angle FMO$</b>。<br>
           两式作差：<br>
           $\\angle OND = \\angle FND - \\angle FNO$<br>
           $\\angle OME = \\angle FME - \\angle FMO$<br>
           从而得出核心角相等关系：<b style="color:#dc2626;">$\\angle OND = \\angle OME$</b>。`
  },
  {
    title: '⑥ 结论：等腰外角推得 $\\angle OBD = \\angle OAE$',
    body: `在 $\\text{Rt}\\triangle ODB$ 中，$NB = ND = NO$，$\\triangle NOB$ 是等腰三角形，外角 $\\angle OND = 2\\angle OBD$，即 <b>$\\angle OBD = \\frac{1}{2}\\angle OND$</b>。<br>
           同理在 $\\text{Rt}\\triangle OEA$ 中，$MA = ME = MO$，等腰 $\\triangle MOA$ 外角 $\\angle OME = 2\\angle OAE$，即 <b>$\\angle OAE = \\frac{1}{2}\\angle OME$</b>。<br>
           因 $\\angle OND = \\angle OME$，立得：<br>
           <b style="color:#2563eb; font-size:15.5px;">$\\angle OBD = \\angle OAE$</b>。<br>
           命题获证！`
  }
];

/* ============ 交互控制逻辑 ============ */
let cur = 0, timer = null;
const listEl = document.getElementById('stepList');
steps.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'step-item';
  d.innerHTML = `<div class="title"><span class="badge">${i===0?'✦':i}</span>${s.title}</div>
                 <div class="body">${s.body}</div>`;
  d.onclick = () => { stopAuto(); goTo(i); };
  listEl.appendChild(d);
});
if (typeof window.renderMath === 'function') window.renderMath(listEl);
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnAuto = document.getElementById('btnAuto');

function goTo(i){
  cur = Math.max(0, Math.min(steps.length-1, i));
  [...listEl.children].forEach((d, k) => {
    d.classList.toggle('active', k === cur);
    d.classList.toggle('done', k < cur);
  });
  renderStep(cur);
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;
  if (listEl.children[cur]) {
    listEl.children[cur].scrollIntoView({block:'nearest', behavior:'smooth'});
  }

  if (typeof window.renderMath === 'function') window.renderMath();
  if (typeof renderMath === "function") renderMath();
}
btnPrev.onclick = () => { stopAuto(); goTo(cur-1); };
btnNext.onclick = () => { stopAuto(); goTo(cur+1); };
document.getElementById('btnReset').onclick = () => { stopAuto(); goTo(0); };
function stopAuto(){
  if (timer){ clearInterval(timer); timer = null; btnAuto.textContent = '▶ 自动'; }
}
btnAuto.onclick = () => {
  if (timer){ stopAuto(); return; }
  btnAuto.textContent = '⏸ 暂停';
  if (cur >= steps.length - 1) goTo(0);
  timer = setInterval(() => {
    if (cur >= steps.length - 1){ stopAuto(); return; }
    goTo(cur + 1);
  }, 2600);
};
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'){ stopAuto(); goTo(cur-1); }
  if (e.key === 'ArrowRight'){ stopAuto(); goTo(cur+1); }
});

drawBase();
goTo(parseInt(new URLSearchParams(location.search).get('step')) || 0);
</script>

<!-- KaTeX 动态渲染与自适应触发脚本 -->
<script>
function renderMath(target) {
  if (typeof renderMathInElement === 'function') {
    const el = (target && target.nodeType) ? target : document.body;
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      macros: {
        '\parallel': '\mathbin{/\!/}',
        '\parallelogram': '\mathbin{/\!/}',
        '\bigtriangleup': '\triangle',
        '\triangle': '\triangle'
      },
      throwOnError: false,
      strict: false
    });
  }
}
window.renderMath = renderMath;
window.addEventListener('DOMContentLoaded', () => {
  renderMath();
  let mathTimer = null;
  const observer = new MutationObserver(() => {
    if (mathTimer) clearTimeout(mathTimer);
    mathTimer = setTimeout(() => renderMath(), 30);
  });
  observer.observe(document.body, { childList: true, subtree: true });
});
window.addEventListener('load', () => renderMath());
</script>
