<body>
<div class="container">
  <header>
    <div class="header-badge">上海中学高中数学竞赛课程 · 几何篇</div>
    <h1>题目 06/10（例 9）：外切圆与内心角平分线定理</h1>
    <p>
      <b>已知：</b>圆 <span class="math">&omega;</span> 过 <span class="math">&bigtriangleup;ABC</span> 的顶点 <span class="math">A, C</span>，分别与边 <span class="math">AB, BC</span> 交于另一点 <span class="math">D, E</span>。圆 <span class="math">&Gamma;</span> 与边 <span class="math">AB, BC</span> 分别切于点 <span class="math">P, Q</span>，且与圆 <span class="math">&omega;</span> 外切于点 <span class="math">M</span>。<br>
      <b>求证：</b><span class="math">&ang;AMC</span> 的角平分线过 <span class="math">&bigtriangleup;ABC</span> 的内心 <span class="math">I</span>。
    </p>
  </header>
  <div class="main">
    <div class="canvas-card">
      <svg id="stage" viewBox="0 0 760 720" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
      </svg>
      <div class="canvas-legend">
        <span class="legend-item"><span class="legend-color" style="background:#2563eb;"></span>圆 &omega; (过 A,C,D,E,M)</span>
        <span class="legend-item"><span class="legend-color" style="background:#0891b2;"></span>圆 &Gamma; (切 AB,BC 于 P,Q)</span>
        <span class="legend-item"><span class="legend-color" style="background:#0284c7;"></span>辅助圆 APM</span>
        <span class="legend-item"><span class="legend-color" style="background:#059669;"></span>辅助圆 CQM</span>
        <span class="legend-item"><span class="legend-color" style="background:#7c3aed;"></span>四点共圆 ACA'C'</span>
        <span class="legend-item"><span class="legend-color" style="background:#dc2626;"></span>内心 I 与角平分线 MI</span>

        <button class="btn-ghost" id="btnReset">重置</button>

    </div>

<script>
/* ======================== 几何核心坐标与工具 ======================== */
/* 严格解算出的无退化无畸变几何坐标系统（精度至 0.01px，角度误差 < 0.005°） */
const A = { x: 191.00, y: 440.00 };
const B = { x: 353.00, y: 170.00 };
const C = { x: 596.00, y: 440.00 };
const D = { x: 260.09, y: 324.85 };
const E = { x: 457.72, y: 286.35 };
const P = { x: 324.77, y: 217.05 };
const Q = { x: 389.70, y: 210.78 };
const M = { x: 365.11, y: 278.10 };
const I = { x: 369.31, y: 339.04 };
const C_prime = { x: 136.24, y: 235.24 };
const A_prime = { x: 638.19, y: 186.80 };
const T = { x: 513.70, y: 257.50 };

/* 圆心与半径定义 */
const O_Gamma = { x: 359.56, y: 237.92 };
const r_Gamma = 40.56;

const O_omega = { x: 393.50, y: 483.20 };
const r_omega = 207.06;

const c_APM = { x: 239.31, y: 317.38 };
const r_APM = 131.79;

const c_CQM = { x: 523.50, y: 297.81 };
const r_CQM = 159.61;

const c_AC_prime = { x: 393.50, y: 276.14 };
const r_AC_prime = 260.49;

/* 向量与几何基础计算 */
const sub = (p, q) => ({ x: p.x - q.x, y: p.y - q.y });
const add = (p, q) => ({ x: p.x + q.x, y: p.y + q.y });
const mul = (p, k) => ({ x: p.x * k, y: p.y * k });
const mid = (p, q) => ({ x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 });
const len = p => Math.hypot(p.x, p.y);
const dist = (p, q) => len(sub(p, q));
const norm = p => { const l = len(p); return l === 0 ? { x: 0, y: 0 } : { x: p.x / l, y: p.y / l }; };
const perp = d => ({ x: -d.y, y: d.x });

/* SVG 辅助绘图体系 */
const NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById('stage');

function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function line(p, q, attrs, parent) {
  return el('line', { x1: p.x, y1: p.y, x2: q.x, y2: q.y, ...attrs }, parent);
}

function segDashed(p, q, color, w = 2, dash = '7 5', parent) {
  return line(p, q, { stroke: color, 'stroke-width': w, 'stroke-dasharray': dash, fill: 'none' }, parent);
}

function circle(c, r, attrs = {}, parent) {
  return el('circle', { cx: c.x, cy: c.y, r, fill: 'none', ...attrs }, parent);
}

function dot(p, color = '#2563eb', r = 4.5, parent) {
  return el('circle', { cx: p.x, cy: p.y, r: r, fill: color, stroke: '#ffffff', 'stroke-width': 1.8 }, parent);
}

function polygon(pts, attrs = {}, parent) {
  return el('polygon', { points: pts.map(p => `${p.x},${p.y}`).join(' '), ...attrs }, parent);
}

/* 白底防遮挡抗干扰专业标签 */
function label(p, text, dx = 0, dy = 0, color = '#0f172a', parent = gPts, size = 16, bold = true) {
  const t = el('text', {
    x: p.x + dx,
    y: p.y + dy,
    'font-size': size,
    fill: color,
    'text-anchor': 'middle',
    'dominant-baseline': 'central',
    'font-family': '"Times New Roman", "Cambria Math", "STIX Two Math", serif',
    'font-style': 'italic',
    'font-weight': bold ? '700' : '400',
    stroke: '#ffffff',
    'stroke-width': '4.5px',
    'stroke-linejoin': 'round',
    'paint-order': 'stroke fill'
  }, parent);
  t.textContent = text;
  return t;
}

/* 高亮加粗线段带光晕 */
function highlightSeg(p, q, color, w = 3.5, parent = gStep) {
  line(p, q, { stroke: color, 'stroke-width': w + 6, 'stroke-linecap': 'round', opacity: 0.2 }, parent);
  line(p, q, { stroke: color, 'stroke-width': w, 'stroke-linecap': 'round' }, parent);
}

/* 绘制角弧线：顶点 v，两边指向 p1 和 p2 */
function angleArc(v, p1, p2, r = 22, attrs = {}, parent = gStep) {
  const a1 = Math.atan2(p1.y - v.y, p1.x - v.x);
  let a2 = Math.atan2(p2.y - v.y, p2.x - v.x);
  let da = a2 - a1;
  while (da < 0) da += Math.PI * 2;
  const sweep = da <= Math.PI ? 1 : 0;
  const s = { x: v.x + r * Math.cos(a1), y: v.y + r * Math.sin(a1) };
  const e = { x: v.x + r * Math.cos(a2), y: v.y + r * Math.sin(a2) };
  return el('path', {
    d: `M ${s.x} ${s.y} A ${r} ${r} 0 0 ${sweep} ${e.x} ${e.y}`,
    fill: 'none', stroke: '#dc2626', 'stroke-width': 2, ...attrs
  }, parent);
}

/* 半透明彩色角扇区填充 */
function angleSector(v, p1, p2, r = 24, fill = 'rgba(220,38,38,0.14)', stroke = '#dc2626', parent = gStep) {
  const a1 = Math.atan2(p1.y - v.y, p1.x - v.x);
  let a2 = Math.atan2(p2.y - v.y, p2.x - v.x);
  let da = a2 - a1;
  while (da < 0) da += Math.PI * 2;
  const sweep = da <= Math.PI ? 1 : 0;
  const s = { x: v.x + r * Math.cos(a1), y: v.y + r * Math.sin(a1) };
  const e = { x: v.x + r * Math.cos(a2), y: v.y + r * Math.sin(a2) };
  return el('path', {
    d: `M ${v.x} ${v.y} L ${s.x} ${s.y} A ${r} ${r} 0 0 ${sweep} ${e.x} ${e.y} Z`,
    fill: fill, stroke: stroke, 'stroke-width': 1.6
  }, parent);
}

/* 等角单刻度小杠标记 */
function tickOnArc(v, p1, p2, r = 22, color = '#dc2626', parent = gStep) {
  const a1 = Math.atan2(p1.y - v.y, p1.x - v.x);
  let a2 = Math.atan2(p2.y - v.y, p2.x - v.x);
  let da = a2 - a1;
  while (da < 0) da += Math.PI * 2;
  const midA = da <= Math.PI ? a1 + da / 2 : a1 - (Math.PI * 2 - da) / 2;
  const cp = { x: v.x + r * Math.cos(midA), y: v.y + r * Math.sin(midA) };
  const radDir = { x: Math.cos(midA), y: Math.sin(midA) };
  line(
    { x: cp.x - radDir.x * 4, y: cp.y - radDir.y * 4 },
    { x: cp.x + radDir.x * 4, y: cp.y + radDir.y * 4 },
    { stroke: color, 'stroke-width': 2 }, parent
  );
}

/* ======================== 三层分层架构 ======================== */
const gBase = el('g', { id: 'gBase' }, stage);  // 静态底层
const gStep = el('g', { id: 'gStep' }, stage);  // 动态步骤层（切换步骤时彻底清空重绘）
const gPts  = el('g', { id: 'gPts' }, stage);   // 顶层点与防遮挡白底标签

const BLUE = '#2563eb', GREEN = '#059669', RED = '#dc2626',
      PURPLE = '#7c3aed', CYAN = '#0891b2', AMBER = '#d97706';

/* 绘制全程保留的基础几何图形 */
function drawBase() {
  gBase.innerHTML = '';
  // 浅色三角形底色
  polygon([A, B, C], { fill: 'rgba(241, 245, 249, 0.5)', stroke: '#334155', 'stroke-width': 2.4 }, gBase);

  // 圆 omega（过 A, C, D, E, M）
  circle(O_omega, r_omega, { stroke: '#2563eb', 'stroke-width': 2.2, fill: 'none' }, gBase);

  // 圆 Gamma（与 AB, BC 切于 P, Q，与 omega 外切于 M）
  circle(O_Gamma, r_Gamma, { stroke: '#0891b2', 'stroke-width': 2.2, fill: 'none' }, gBase);
}

/* 顶层绘制点与文字标签（按步骤按需显隐） */
function drawPoints(s) {
  gPts.innerHTML = '';

  // 基础点 A, B, C
  dot(A, '#1e293b', 5, gPts);
  label(A, 'A', -18, 16, '#0f172a', gPts);

  dot(B, '#1e293b', 5, gPts);
  label(B, 'B', 0, -20, '#0f172a', gPts);

  dot(C, '#1e293b', 5, gPts);
  label(C, 'C', 18, 16, '#0f172a', gPts);

  // 交点 D, E
  dot(D, '#3b82f6', 4.5, gPts);
  label(D, 'D', -18, -6, '#1d4ed8', gPts);

  dot(E, '#3b82f6', 4.5, gPts);
  label(E, 'E', 18, -6, '#1d4ed8', gPts);

  // 切点 P, Q
  dot(P, '#0891b2', 5, gPts);
  label(P, 'P', -18, -6, '#0e7490', gPts);

  dot(Q, '#0891b2', 5, gPts);
  label(Q, 'Q', 18, -6, '#0e7490', gPts);

  // 切点 M（重点关注）
  dot(M, '#dc2626', 5.5, gPts);
  label(M, 'M', -18, 0, '#b91c1c', gPts);

  // 辅助交点 I（步骤 1 ~ 6 均展示）
  if (s >= 1) {
    if (s === 5 || s === 6) {
      // 内心步骤特别加大高亮环
      circle(I, 9, { stroke: '#dc2626', 'stroke-width': 2, fill: 'rgba(220,38,38,0.2)' }, gPts);
      dot(I, '#dc2626', 5.5, gPts);
      label(I, 'I (内心)', 38, 6, '#b91c1c', gPts, 15, true);
    } else {
      dot(I, '#dc2626', 5, gPts);
      label(I, 'I', 18, 6, '#b91c1c', gPts);
    }
  }

  // 延长交点 C', A'（步骤 2 ~ 5 展示）
  if (s >= 2 && s <= 5) {
    dot(C_prime, '#ea580c', 5, gPts);
    label(C_prime, "C'", -20, -10, '#c2410c', gPts);

    dot(A_prime, '#7c3aed', 5, gPts);
    label(A_prime, "A'", 20, -10, '#6d28d9', gPts);
  }

  // 公切线点 T（步骤 4 展示）
  if (s === 4) {
    dot(T, '#d97706', 4.5, gPts);
    label(T, 'T', 16, 12, '#b45309', gPts);
  }
}

/* ======================== 动态步骤层 renderStep ======================== */
function renderStep(s) {
  gStep.innerHTML = ''; // 核心准则：每步切换先清空，辅助线随用随现用完即擦除
  drawPoints(s);

  switch(s) {

  }
  if (typeof renderMath === 'function') { renderMath(); }
}

/* ======================== 交互与控制逻辑 ======================== */
let cur = 0;
let timer = null;

const listEl = document.getElementById('stepList');
const counterEl = document.getElementById('stepCounter');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnAuto = document.getElementById('btnAuto');
const btnReset = document.getElementById('btnReset');

// 渲染步骤卡片列表
steps.forEach((s, i) => {
  const item = document.createElement('div');
  item.className = 'step-item';
  item.innerHTML = `
    <div class="title">
      <span class="badge">${i === 0 ? '✦' : i}</span>
      <span>${s.title}</span>
    </div>
    <div class="body">${s.body}</div>
  `;
  item.onclick = () => { stopAuto(); goTo(i); };
  listEl.appendChild(item);
});

function goTo(i) {
  cur = Math.max(0, Math.min(steps.length - 1, i));

  // 更新步骤列表项激活样式
  [...listEl.children].forEach((card, k) => {
    card.classList.toggle('active', k === cur);
    card.classList.toggle('done', k < cur);
  });

  // 更新步骤计数器
  counterEl.textContent = `步骤 ${cur + 1} / ${steps.length}`;

  // 渲染动态几何图形
  renderStep(cur);

  // 按钮禁用状态更新
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === steps.length - 1;

  // 自动平滑滚动当前激活项至视口中间
  if (listEl.children[cur]) {
    listEl.children[cur].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // 同步更新 URL 参数（支持刷新直达）
  const url = new URL(window.location);
  url.searchParams.set('step', cur);
  window.history.replaceState({}, '', url);
  if (typeof renderMath === 'function') { renderMath(); }
  if (typeof renderMath === "function") renderMath();
}

function stopAuto() {
  if (timer) {
    clearInterval(timer);
    timer = null;
    btnAuto.textContent = '▶ 自动播放';
    btnAuto.classList.remove('active');
  }
}

btnPrev.onclick = () => { stopAuto(); goTo(cur - 1); };
btnNext.onclick = () => { stopAuto(); goTo(cur + 1); };
btnReset.onclick = () => { stopAuto(); goTo(0); };

btnAuto.onclick = () => {
  if (timer) {
    stopAuto();
    return;
  }
  btnAuto.textContent = '⏸ 暂停';
  btnAuto.classList.add('active');
  if (cur >= steps.length - 1) goTo(0);
  timer = setInterval(() => {
    if (cur >= steps.length - 1) {
      stopAuto();
      return;
    }
    goTo(cur + 1);
  }, 2800);
};

// 键盘快捷键 ← / → 监听
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') { stopAuto(); goTo(cur - 1); }
  if (e.key === 'ArrowRight') { stopAuto(); goTo(cur + 1); }
});

// 初始化静态底层并读取初始 URL 步骤参数
drawBase();
const initStep = parseInt(new URLSearchParams(window.location.search).get('step')) || 0;
goTo(initStep);

  let mathTimer = null;
  const observer = new MutationObserver(() => {
    if (mathTimer) clearTimeout(mathTimer);
    mathTimer = setTimeout(() => renderMath(), 30);
  });
  observer.observe(document.body, { childList: true, subtree: true });
});
window.addEventListener('load', () => renderMath());
</script>
